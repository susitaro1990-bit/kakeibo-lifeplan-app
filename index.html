<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夫婦家計簿 &amp; ライフプラン</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="夫婦家計簿">
<style>
  :root{
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#e2e6e4;
    --text:#1f2a24;
    --text-dim:#6b7770;
    --accent:#3f7a5c;
    --accent-dim:#eaf3ee;
    --income:#3f7a5c;
    --expense:#c1553e;
    --self-color:#3f7a5c;
    --spouse-color:#a9762c;
    --radius:14px;
    --shadow:0 1px 3px rgba(20,30,25,0.06), 0 1px 2px rgba(20,30,25,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{overflow-y:scroll;scrollbar-gutter:stable;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:0 14px;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(244,246,245,0.92);
    backdrop-filter:blur(6px);
  }
  .topbar-inner{
    max-width:640px;margin:0 auto;padding:12px 14px 0;
  }
  .title-row{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .title-row h1{
    font-size:16px;font-weight:700;margin:0;letter-spacing:.02em;
  }
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-icon{
    width:32px;height:32px;flex-shrink:0;color:var(--accent);
    filter:drop-shadow(0 1px 1px rgba(20,30,25,0.15));
    transition:color .3s;
  }
  .brand-text h1{
    font-size:17px;font-weight:800;margin:0;letter-spacing:.02em;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    color:var(--text);line-height:1.15;
  }
  .brand-text .brand-sub{
    font-size:9px;letter-spacing:.16em;color:var(--text-dim);
    text-transform:uppercase;font-weight:700;margin-top:1px;
  }
  .icon-group{display:flex;gap:6px;}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    color:var(--text-dim);cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .15s, color .15s, border-color .15s;
  }
  button:focus-visible, [role=button]:focus-visible, .tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .icon-btn{position:relative;}
  .icon-btn.has-pending::after{
    content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;
    background:var(--expense);border:1.5px solid var(--card);
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .icon-btn.spinning svg{animation:icon-spin .8s linear infinite;}
  @keyframes icon-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  nav.tabs{
    display:flex;gap:2px;margin-top:10px;
    border-bottom:1.5px solid var(--border);
  }
  nav.tabs button{
    flex:1;padding:10px 4px;background:transparent;
    border:1px solid transparent;border-bottom:none;
    border-radius:10px 10px 0 0;
    font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;
    position:relative;
    transition:background .15s,color .15s;
  }
  nav.tabs button:not(.active):hover{
    background:rgba(63,122,92,0.07);color:var(--accent);
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--accent);font-weight:800;
    border-color:var(--border);
    border-bottom:1.5px solid var(--card);
    margin-bottom:-1.5px;
    box-shadow:0 -2px 6px rgba(20,30,25,0.05);
  }
  nav.tabs button.disabled{
    color:#bfc7c2;cursor:default;
  }

  main{padding:14px 0 30px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px;margin:0 0 12px;color:var(--text);font-weight:700;}
  .section-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}

  .view-toggle{
    display:flex;gap:6px;margin-bottom:14px;
  }
  .view-toggle button{
    flex:1;padding:9px 4px;border:1px solid var(--border);background:var(--card);
    border-radius:10px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }

  .summary-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
  }
  .summary-box{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 8px;text-align:center;
  }
  .summary-box .label{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
  .summary-box .val{font-size:15px;font-weight:700;}
  .val.income{color:var(--income);}
  .val.expense{color:var(--expense);}
  .val.balance.pos{color:var(--income);}
  .val.balance.neg{color:var(--expense);}

  form.entry-form{display:flex;flex-direction:column;gap:10px;}
  .form-row{display:flex;gap:8px;}
  /* 同じ行の隣のラベルだけが2行に折り返しても、入力欄の高さ・位置がずれないように、
     ラベルは上に、入力欄は下にそろえる（ラベルが余った高さを受け持つ）。 */
  .form-row > div{flex:1;min-width:0;display:flex;flex-direction:column;}
  .form-row > div > label{flex:1 1 auto;}
  .form-row + .form-row{margin-top:10px;}
  form.entry-form .form-row + .form-row{margin-top:0;} /* このフォームは flex の gap で間隔を取っている */
  label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;font-weight:600;}
  input, select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;
    font-size:14px;background:#fbfcfb;color:var(--text);font-family:inherit;
  }
  /* 日付・月・数値・文字・選択で、ブラウザごとに高さがまちまちにならないよう統一する */
  input:not([type=checkbox]):not([type=color]):not([type=hidden]), select{height:44px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-dim);border-color:var(--accent);}
  .fixed-checkbox-row{
    display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
    color:var(--text-dim);cursor:pointer;margin:0;
  }
  .fixed-checkbox-row input{width:15px;height:15px;flex-shrink:0;accent-color:var(--accent);cursor:pointer;}
  .type-toggle{display:flex;gap:6px;}
  .type-toggle button{
    flex:1;padding:9px;border:1px solid var(--border);border-radius:9px;background:#fbfcfb;
    font-weight:700;font-size:13px;color:var(--text-dim);cursor:pointer;
  }
  .type-toggle button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .type-toggle button.active.expense{background:#fbeae6;border-color:var(--expense);color:var(--expense);}
  .type-toggle button.active.income{background:#e9f3ee;border-color:var(--income);color:var(--income);}

  .submit-btn{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:11px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:2px;
  }
  .submit-btn:hover{filter:brightness(1.05);}
  .cancel-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;
  }

  /* chart */
  .chart-wrap{overflow-x:auto;}
  svg.chart{display:block;min-width:100%;}
  .bar{cursor:pointer;}
  .bar:hover{opacity:0.8;}
  .axis-label{font-size:10px;fill:var(--text-dim);}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);margin-top:6px;justify-content:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .month-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .month-header .m-label{font-weight:700;font-size:14px;}
  .month-header button{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    text-decoration:underline;
  }

  .entry-list{display:flex;flex-direction:column;gap:6px;}
  .entry-item{
    display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);
    border-radius:10px;background:#fbfcfb;
  }
  .entry-item .who-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .entry-item .main{flex:1;min-width:0;}
  .entry-item .cat{font-size:13px;font-weight:700;}
  .entry-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-item .amt{font-size:14px;font-weight:700;white-space:nowrap;}
  .entry-item .amt.income{color:var(--income);}
  .entry-item .amt.expense{color:var(--expense);}
  .entry-item .del{
    background:none;border:none;color:#c8ccc9;font-size:16px;cursor:pointer;padding:2px 4px;
  }
  .entry-item .del:hover{color:var(--expense);}
  .empty-note{color:var(--text-dim);font-size:13px;text-align:center;padding:20px 0;}

  .placeholder{
    text-align:center;padding:60px 20px;color:var(--text-dim);
  }
  .placeholder .big{font-size:28px;margin-bottom:10px;}
  .placeholder h3{color:var(--text);margin:0 0 6px;font-size:15px;}
  .placeholder p{font-size:13px;line-height:1.6;margin:0;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,25,0.4);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
  }
  .modal{
    background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;
    padding:18px;max-height:85vh;overflow-y:auto;
  }
  @media (min-width:640px){
    .modal{border-radius:16px;}
  }
  .modal h3{margin:0 0 14px;font-size:15px;}
  .modal-close-row{display:flex;justify-content:flex-end;margin-top:14px;gap:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{
    display:flex;align-items:center;gap:6px;background:var(--accent-dim);color:var(--accent);
    padding:6px 10px;border-radius:20px;font-size:12.5px;font-weight:600;
  }
  .chip button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0;}
  .add-chip-row{display:flex;gap:6px;}
  .add-chip-row input{flex:1;}
  .add-chip-row button{
    background:var(--accent);color:#fff;border:none;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer;
  }
  .field-group{margin-bottom:16px;}
  .field-group h4{font-size:12.5px;color:var(--text-dim);margin:0 0 8px;font-weight:700;}
  .name-edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .name-edit-row .dot{width:10px;height:10px;}
  .sync-status{font-size:11.5px;color:var(--text-dim);margin-top:10px;line-height:1.6;}
  .sync-status code{background:var(--accent-dim);padding:1px 5px;border-radius:5px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#1f2a24;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;
    width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.5;
  }
  .toast.show{opacity:1;}

  .fixed-badge{
    display:inline-block;font-size:10px;font-weight:700;color:var(--accent);
    background:var(--accent-dim);padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle;
  }
  .entry-item .edit-btn{
    background:none;border:none;color:#b7bdb9;font-size:14px;cursor:pointer;padding:2px 4px;
  }
  .entry-item .edit-btn:hover{color:var(--accent);}
  .fixed-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .fixed-item{
    display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);
    border-radius:10px;background:#fbfcfb;
  }
  .fixed-item .main{flex:1;min-width:0;}
  .fixed-item .cat{font-size:13px;font-weight:700;}
  .fixed-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .fixed-item .amt{font-size:13.5px;font-weight:700;white-space:nowrap;}
  .fixed-item .amt.income{color:var(--income);}
  .fixed-item .amt.expense{color:var(--expense);}
  .fixed-type{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px;}
  .fixed-type.expense{background:#fbeae6;color:var(--expense);}
  .fixed-type.income{background:#e9f3ee;color:var(--income);}

  .theme-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .theme-row-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:76px;}
  .swatch-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .swatch{
    width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
    box-shadow:0 0 0 1px rgba(20,30,25,0.08);
  }
  .swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--text);}
  .custom-color{
    width:30px;height:26px;padding:0;border:1px solid var(--border);border-radius:8px;cursor:pointer;
    background:none;
  }

  .score-comment{font-size:13px;color:var(--text-dim);text-align:center;margin-top:8px;}

  .preset-row{display:flex;flex-wrap:wrap;gap:6px;}
  .preset-btn{
    padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:#fbfcfb;
    font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;
  }
  .preset-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}

  input.input-error, select.input-error{border-color:var(--expense);background:#fdf3f1;}
  .jump-row{margin-bottom:14px;flex-wrap:nowrap;}
  .jump-row .preset-btn{flex:1;padding:7px 2px;text-align:center;white-space:nowrap;}
  #mainArea > .card{scroll-margin-top:128px;}
  #lpSaveBtn{position:sticky;bottom:14px;z-index:6;box-shadow:0 6px 18px rgba(20,30,25,0.28);}
  .withdraw-types{margin:4px 0 10px;}
  .withdraw-types .chk-row{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:2px;}
  .summary-note{font-size:11.5px;color:var(--text-dim);text-align:center;margin:-6px 0 14px;}
  .pie-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px;font-size:12px;color:var(--text-dim);margin-bottom:12px;}
  .pie-summary b{font-size:13.5px;color:var(--text);}
  .pie-summary b.income{color:var(--income);} .pie-summary b.expense{color:var(--expense);}
  .pie-wrap{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .pie-svg{width:160px;height:160px;flex-shrink:0;margin:0 auto;}
  .pie-legend{flex:1;min-width:190px;}
  .pie-legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;}
  .pie-legend-row.sel{background:var(--accent-dim);}
  .pie-legend-row:focus-visible{outline:2px solid var(--accent);}
  .pie-slice{cursor:pointer;transition:opacity .15s;}
  .pie-svg.has-sel .pie-slice:not(.sel){opacity:.3;}
  .pie-detail{margin-top:10px;padding:10px 12px;background:#f6f8f7;border-radius:10px;font-size:12.5px;line-height:1.6;color:var(--text-dim);}
  .pie-detail b{color:var(--text);}
  .pie-parts{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:12px;color:var(--text-dim);}
  .analysis-views{margin-bottom:14px;}
  .month-nav{display:flex;gap:8px;align-items:stretch;}
  .month-nav input{flex:1;min-width:0;}
  .month-nav button{
    width:44px;flex-shrink:0;border:1px solid var(--border);border-radius:9px;background:#fbfcfb;
    font-size:22px;line-height:1;color:var(--text-dim);cursor:pointer;
  }
  .month-nav button:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}
  .pie-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .pie-name{flex:1;font-weight:600;}
  .pie-val{font-weight:700;} .pie-pct{margin-left:6px;font-size:11px;font-weight:600;color:var(--text-dim);}
  .analysis-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border);gap:10px;}
  .analysis-row:last-child{border-bottom:none;}
  .analysis-cat{font-weight:700;font-size:13px;flex-shrink:0;}
  .analysis-amt{font-size:12px;color:var(--text-dim);text-align:right;white-space:nowrap;}
  .analysis-amt .avg{font-weight:800;color:var(--text);font-size:14px;}
  .analysis-total{color:var(--text-dim);font-size:11px;margin-left:2px;}

  .expense-accordion{display:flex;flex-direction:column;gap:6px;}
  .exp-cat{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fbfcfb;}
  .exp-cat-head{
    width:100%;display:flex;align-items:center;gap:8px;
    background:none;border:none;padding:11px 12px;cursor:pointer;text-align:left;
    font-family:inherit;color:var(--text);
  }
  .exp-cat-name{font-size:13px;font-weight:700;flex-shrink:0;}
  .exp-cat-sub{font-size:11.5px;color:var(--text-dim);flex:1;text-align:right;}
  .exp-cat-arrow{font-size:11px;color:var(--text-dim);transition:transform .2s;flex-shrink:0;}
  .exp-cat-head.open .exp-cat-arrow{transform:rotate(180deg);}
  .exp-cat-body{padding:2px 12px 12px;border-top:1px solid var(--border);}

  .child-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fbfcfb;}
  .edu-stage-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .edu-stage-label{width:52px;flex-shrink:0;font-size:12.5px;font-weight:700;}
  .edu-stage-row select{flex:2;}
  .edu-stage-row input{flex:1;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="title-row">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- house silhouette with a coin+B mark inside, matching the home-screen icon -->
          <path d="M8 37.2 L32 37.2 L32 13.2 L20 2.8 L8 13.2 Z" fill="currentColor"/>
          <circle cx="20" cy="25.2" r="8" fill="#fff"/>
          <g transform="translate(13,18.2) scale(0.21875)">
            <g transform="translate(0.00630876,-0.00301984)">

/* 古いバージョンの保存データに baseline や incomeGrowthRate が
   欠けているケースを補う（新しい項目を追加するたびにここも更新する）。
   2026-09時点：baseline.monthlyIncome が直接持たれていた旧構造から、
   自分／配偶者それぞれの収入を持つ baseline.self / baseline.spouse
   構造へ移行する処理も兼ねる。 */
function normalizeLifeplanBaseline(p){
  if(p.initialCash == null) p.initialCash = 0;
  if(p.minCashReserve == null) p.minCashReserve = 1000000;
  if(!p.baseline) p.baseline = { monthlyExpense: 0, self: defaultPersonIncome(), spouse: defaultPersonIncome() };
  const b = p.baseline;
  if(!b.self){
    // 旧構造（単一の世帯収入）が残っている場合は「自分」の収入として引き継ぐ
    b.self = defaultPersonIncome();
    if(b.monthlyIncome != null) b.self.monthlyIncome = b.monthlyIncome;
    if(b.incomeGrowthMode != null) b.self.incomeGrowthMode = b.incomeGrowthMode;
    if(b.incomeGrowthRate != null) b.self.incomeGrowthRate = b.incomeGrowthRate;
    if(b.incomeGrowthFixed != null) b.self.incomeGrowthFixed = b.incomeGrowthFixed;
    delete b.monthlyIncome; delete b.incomeGrowthMode; delete b.incomeGrowthRate; delete b.incomeGrowthFixed;
  }
  if(!b.spouse) b.spouse = defaultPersonIncome();
  [b.self, b.spouse].forEach(person=>{
    if(person.incomeGrowthRate == null) person.incomeGrowthRate = 1;
    if(person.incomeGrowthMode == null) person.incomeGrowthMode = 'rate';
    if(person.incomeGrowthFixed == null) person.incomeGrowthFixed = 0;
    if(!person.leaves) person.leaves = [];
  });
  if(!p.expenses) p.expenses = defaultExpenses();
  const ex = p.expenses;
  // 旧バージョンの「月あたりの支出（世帯合計の基準値）」は、10大費目の内訳に
  // 置き換わったため廃止。既存の値は初回だけ「食費」に引き継ぎ、以後は
  // 内訳の各項目を個別に調整してもらう（金額を失わないための一度きりの移行）。
  if(ex.foodMonthly == null) ex.foodMonthly = b.monthlyExpense || 0;
  if(ex.utilitiesMonthly == null) ex.utilitiesMonthly = 0;
  if(ex.furnitureMonthly == null) ex.furnitureMonthly = 0;
  if(ex.clothingMonthly == null) ex.clothingMonthly = 0;
  if(ex.medicalMonthly == null) ex.medicalMonthly = 0;
  if(ex.transportMonthly == null) ex.transportMonthly = 0;
  if(ex.communicationMonthly == null) ex.communicationMonthly = 0;
  if(ex.carLoanParkingMonthly == null) ex.carLoanParkingMonthly = 0;
  if(ex.hobbyMonthly == null) ex.hobbyMonthly = 0;
  if(ex.travelAnnual == null) ex.travelAnnual = 0;
  if(ex.selfAllowance == null) ex.selfAllowance = 0;
  if(ex.spouseAllowance == null) ex.spouseAllowance = 0;
  if(ex.childAllowancePerChild == null) ex.childAllowancePerChild = 0;
  if(ex.childLivingCostPerChild == null) ex.childLivingCostPerChild = 0;
  if(ex.childIndependenceAge == null) ex.childIndependenceAge = 22;
  if(ex.socialMonthly == null) ex.socialMonthly = 0;
  if(ex.contingencyMonthly == null) ex.contingencyMonthly = 0;
  if(!ex.parentCare) ex.parentCare = { startAge: 0, annualCost: 0, years: 0 };
  if(!ex.remittance) ex.remittance = { monthlyAmount: 0, startAge: 0, endAge: 0 };
  if(ex.ceremonyAnnual == null) ex.ceremonyAnnual = 0;

  // 配列・オブジェクト系のトップレベル項目も、欠けていれば安全な既定値で補う。
  // GASからの取得データが古い形式だったり不完全だったりしても、
  // 設定画面や集計処理が「undefined.map」等で落ちないようにするための保険。
  if(!p.mortgage) p.mortgage = { balance: 0, years: 0, rate: 1.0 };
  if(!p.realEstate) p.realEstate = { price: 0, appreciationRate: 0 };
  if(!p.retirement) p.retirement = { pensionAnnual: 0, livingCostAnnual: 0, retireAge: 65 };
  if(p.retirement.spouseRetireAge === undefined) p.retirement.spouseRetireAge = null; // 空欄＝自分と同じ
  if(p.retirement.spouseShare == null) p.retirement.spouseShare = 50; // 年金のうち配偶者分の割合（%）
  if(p.spouseAge === undefined) p.spouseAge = null;
  if(!Array.isArray(p.withdrawTypes)) p.withdrawTypes = ['nisa_tsumitate'];
  if(!p.retirementBonus) p.retirementBonus = { amount: 0, age: 65 };
  if(!p.car) p.car = { cycleYears: 0, cost: 0 };
  if(!Array.isArray(p.insurances)) p.insurances = [];
  if(!Array.isArray(p.investments)) p.investments = [];
  if(!Array.isArray(p.children)) p.children = [];
  if(!Array.isArray(p.otherEvents)) p.otherEvents = [];
}

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return structuredClone(fallback);
    return JSON.parse(raw);
  }catch(e){ return structuredClone(fallback); }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let entries = loadJSON(STORAGE_KEY, []);
// 新しく増えた費目を、既存の費目リストにまだ無ければ追加する。
// サーバーから取得した費目リストにも同じ処理をかける（古いままだと消えてしまうため）。
function migrateCategories(c){
  ['被服及び履物費','美容費'].forEach(cat=>{
    if(!c.expense.includes(cat)){
      const idx = c.expense.indexOf('日用品費');
      if(idx === -1) c.expense.push(cat);
      else c.expense.splice(idx+1, 0, cat);
    }
  });
  if(!c.expense.includes(INVEST_CATEGORY)){
    const idx = c.expense.indexOf('その他');
    if(idx === -1) c.expense.push(INVEST_CATEGORY);
    else c.expense.splice(idx, 0, INVEST_CATEGORY);
  }
  return c;
}
let categories = migrateCategories(loadJSON(CATEGORY_KEY, DEFAULT_CATEGORIES));
saveJSON(CATEGORY_KEY, categories);
let people = migratePeopleNames(loadJSON(PEOPLE_KEY, DEFAULT_PEOPLE));
saveJSON(PEOPLE_KEY, people);
let config = loadJSON(CONFIG_KEY, DEFAULT_CONFIG);
let fixedCosts = loadJSON(FIXED_KEY, []); // [{id, type, person, category, amount, dayOfMonth, memo, startMonth}]
let fixedLog = loadJSON(FIXED_LOG_KEY, {}); // { [fixedId]: ['YYYY-MM', ...] } 生成済み月の記録
let themeColors = loadJSON(THEME_KEY, DEFAULT_THEME_COLORS); // { self, spouse } それぞれのテーマカラー
let lifeplan = loadJSON(LIFEPLAN_KEY, defaultLifeplan());
normalizeLifeplanBaseline(lifeplan); // 旧バージョンからの移行用

/* ---- GAS 連携（送信キュー付き） ----
   GAS Web App URL が空の間はローカル保存のみで動作する。
   URL が設定されている場合、家計簿の追加・更新・削除と設定類の保存は
   いったん端末の「送信キュー」に積み、順番に GAS へ送る。送れなかった分
   （圏外・GAS が混み合っている等）は端末に残り、通信が戻ったときや
   次回の同期時に自動で再送する。取得（pull）で入力が消えないよう、
   取得結果には未送信の変更を重ねて反映する。 */
const OUTBOX_KEY = 'kakeibo_outbox_v1';
let outbox = loadJSON(OUTBOX_KEY, []); // [{ seq, action, payload }] 未送信の変更（古い順）
let outboxSeq = outbox.reduce((m, o) => Math.max(m, o.seq || 0), 0);
let inflightSeq = null; // 送信中の変更（まとめ直しの対象にしない）
let flushPromise = null;
let syncFailureNotified = false;
let pullInFlight = false;
let opsDuringPull = []; // 取得中に発生した変更（取得結果に重ねるため保持）

function persistOutbox(){
  saveJSON(OUTBOX_KEY, outbox);
  updateSyncBadge();
}

function updateSyncBadge(){
  const btn = document.getElementById('btnSyncNow');
  if(!btn) return;
  const n = outbox.length;
  btn.classList.toggle('has-pending', n > 0);
  btn.title = n > 0 ? `未送信の変更が${n}件あります（タップで再送して最新を取得）` : '最新のデータを取得';
}

function enqueueOutbox(action, payload){
  if(action === 'setState'){
    // 同じ設定の未送信分は最新の1件だけ残せばよい
    outbox = outbox.filter(o => !(o.action === 'setState' && o.payload.key === payload.key && o.seq !== inflightSeq));
  }
  const op = { seq: ++outboxSeq, action, payload };
  outbox.push(op);
  if(pullInFlight) opsDuringPull.push(op);
  persistOutbox();
}

function syncToGAS(action, payload){
  if(!config.gasUrl){
    console.log('[GAS dummy sync]', action, payload);
    return Promise.resolve({ status:'ok', dummy:true });
  }
  enqueueOutbox(action, payload);
  return flushOutbox();
}

function flushOutbox(){
  if(!config.gasUrl || !outbox.length) return Promise.resolve(true);
  if(flushPromise) return flushPromise;
  flushPromise = doFlushOutbox().finally(()=>{ flushPromise = null; });
  return flushPromise;
}

async function doFlushOutbox(){
  while(outbox.length){
    const op = outbox[0];
    inflightSeq = op.seq;
    let ok = false, reason = '';
    try{
      const res = await fetch(config.gasUrl, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain' },
        body: JSON.stringify({ action: op.action, payload: op.payload, secret: config.gasSecret || '' })
      });
      const data = await res.json().catch(()=>null);
      ok = !!data && data.status === 'ok';
      if(!ok) reason = (data && data.error) ? data.error : 'invalid response';
    }catch(e){
      reason = String(e);
    }
    inflightSeq = null;
    if(!ok){ reportSyncFailure(reason); return false; }
    outbox = outbox.filter(o => o.seq !== op.seq);
    persistOutbox();
  }
  syncFailureNotified = false;
  return true;
}

function reportSyncFailure(reason){
  console.error('GAS sync failed:', reason);
  if(syncFailureNotified) return;
  syncFailureNotified = true;
  showToast(reason === 'unauthorized'
    ? '合言葉が違うため同期できません（設定を確認してください）'
    : '同期できませんでした。この端末には保存済みで、つながったら自動で再送します');
}

function uniqueById(list){
  const seen = new Set();
  return list.filter(e=>{
    if(seen.has(e.id)) return false;
    seen.add(e.id);
    return true;
  });
}

/* 取得した一覧に、まだ送れていない追加・更新・削除を重ねる。 */
function applyPendingEntryOps(list, ops){
  const byId = new Map(list.map(e => [e.id, e]));
  ops.forEach(op=>{
    if(op.action === 'addEntry' || op.action === 'updateEntry') byId.set(op.payload.id, { ...op.payload });
    else if(op.action === 'deleteEntry') byId.delete(op.payload.id);
  });
  return Array.from(byId.values());
}

function mergeFixedLogs(a, b){
  const out = {};
  [a, b].forEach(src=>{
    Object.keys(src || {}).forEach(id=>{
      out[id] = Array.from(new Set([...(out[id] || []), ...(src[id] || [])])).sort();
    });
  });
  return out;
}
function countFixedLogMonths(l){
  return Object.keys(l || {}).reduce((s, id) => s + (l[id] || []).length, 0);
}

/* ---- 起動時にスプレッドシートから取得 ----
   GAS Web App URL が設定されていれば、起動時に一度だけ GET して
   スプレッドシート側の最新内容（家計簿の全件＋設定類）を取り込む。
   スプレッドシートを「正」とみなし、ローカルの値を上書きする
   （＝配偶者の端末で行われた変更もここで反映される）。ただし、
   まだ送れていない自分の変更は、取得結果に重ねて残す。
   取得に失敗しても致命的にはせず、ローカルのデータで動作を続ける。
   成功したら true、失敗したら false を返す。

   ヘッダーの更新ボタンと、ライフプラン設定を開く直前の取得が
   ほぼ同時に呼ばれることがある。別々に fetch すると通信中に
   互いの結果で状態を上書きし合い、画面が更新されないことが
   あったため、すでに取得中なら新しく fetch せず同じ Promise を
   共有して待つようにする。 */
const LAST_SYNC_KEY = 'kakeibo_last_sync_v1';
function lastSyncLabel(){
  const iso = localStorage.getItem(LAST_SYNC_KEY);
  if(!iso) return 'まだ同期していません';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return 'まだ同期していません';
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* サーバーの全件を取得する。合言葉が URL に残らないよう、まず POST（readAll）で取得し、
   まだ readAll に対応していない古い GAS のときだけ、従来の GET に切り替える。 */
async function fetchServerSnapshot(){
  const res = await fetch(config.gasUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain' },
    body: JSON.stringify({ action:'readAll', payload:{}, secret: config.gasSecret || '' })
  });
  const data = await res.json().catch(()=>null);
  if(data && data.status === 'ok') return data;
  if(!(data && /unknown action/.test(data.error || ''))) return data; // 合言葉違いなどは、そのまま呼び出し側へ
  const url = config.gasUrl + '?secret=' + encodeURIComponent(config.gasSecret || '');
  return await (await fetch(url, { method:'GET' })).json();
}

let gasPullPromise = null;
function pullFromGAS(){
  if(!config.gasUrl) return Promise.resolve(true);
  if(gasPullPromise) return gasPullPromise;
  gasPullPromise = pullFromGASOnce().finally(()=>{ gasPullPromise = null; });
  return gasPullPromise;
}
async function pullFromGASOnce(){
  try{
    await flushOutbox(); // まず未送信分を送る（送れなければ、下で取得結果に重ねて残す）
    pullInFlight = true;
    opsDuringPull = [];
    const data = await fetchServerSnapshot();
    if(!data || data.status !== 'ok') throw new Error((data && data.error) || 'invalid response');

    // 取得中に発生した変更も含めて、まだ取得結果に反映されていない変更を集める
    const seen = new Set();
    const pendingOps = [...outbox, ...opsDuringPull]
      .filter(o => !seen.has(o.seq) && seen.add(o.seq))
      .sort((a, b) => a.seq - b.seq);
    const pendingKeys = new Set(pendingOps.filter(o => o.action === 'setState').map(o => o.payload.key));

    if(Array.isArray(data.entries)){
      // GAS/スプレッドシート側で日付が Date 型に自動変換され、
      // ISO日時（例: 2026-09-06T15:00:00.000Z）のまま返ってくることがあるため、
      // 念のためアプリ側でも "YYYY-MM-DD" に正規化しておく。
      const fromServer = uniqueById(data.entries.map(e=>({
        ...e,
        amount: Number(e.amount) || 0,
        date: normalizeDateString(e.date),
      })));
      entries = applyPendingEntryOps(fromServer, pendingOps);
      saveJSON(STORAGE_KEY, entries);
    }
    const st = data.state || {};
    const applyState = (key, setter) => {
      if(st[key] == null) return;
      if(pendingKeys.has(key)) return; // この端末で保存した最新の内容が未送信のときは、それを優先する
      try{ setter(JSON.parse(st[key])); }catch(err){ console.error('failed to parse GAS state for', key, err); }
    };
    applyState('categories', v=>{
      const before = JSON.stringify(v);
      categories = migrateCategories(v);
      saveJSON(CATEGORY_KEY, categories);
      if(JSON.stringify(categories) !== before) syncState('categories', categories);
    });
    applyState('people', v=>{
      const migrated = migratePeopleNames(v);
      people = migrated;
      saveJSON(PEOPLE_KEY, people);
      // スプレッドシート側がまだ旧デフォルト名だった場合は、次回以降も
      // 巻き戻らないようにここで正しい値を書き戻しておく。
      if(migrated !== v) syncState('people', people);
    });
    applyState('fixedCosts', v=>{ fixedCosts = v; saveJSON(FIXED_KEY, fixedCosts); });
    // 固定費の生成済み月は「増える一方の記録」なので、上書きではなく両方を合わせる
    if(st.fixedLog != null){
      try{
        const server = JSON.parse(st.fixedLog);
        fixedLog = mergeFixedLogs(fixedLog, server);
        saveJSON(FIXED_LOG_KEY, fixedLog);
        if(countFixedLogMonths(fixedLog) > countFixedLogMonths(server)) syncState('fixedLog', fixedLog);
      }catch(err){ console.error('failed to parse GAS state for fixedLog', err); }
    }
    applyState('themeColors', v=>{ themeColors = v; saveJSON(THEME_KEY, themeColors); });
    applyState('lifeplan', v=>{ lifeplan = v; normalizeLifeplanBaseline(lifeplan); saveJSON(LIFEPLAN_KEY, lifeplan); });

    generateFixedEntries();
    dedupeFixedEntries();
    applyTheme();
    const activeTabBtn = document.querySelector('.tab-btn.active');
    const activeTab = activeTabBtn ? activeTabBtn.dataset.tab : 'ledger';
    if(activeTab === 'analysis') renderAnalysisTab();
    else if(activeTab === 'lifeplan') renderLifeplanTab();
    else renderAll();
    syncFailureNotified = false;
    localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString());
    showToast(outbox.length
      ? `同期しました（未送信の変更が${outbox.length}件残っています）`
      : 'スプレッドシートと同期しました');
    return true;
  }catch(e){
    console.error('GAS pull failed', e);
    return false;
  }finally{
    pullInFlight = false;
    opsDuringPull = [];
  }
}

function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function persistEntries(){ saveJSON(STORAGE_KEY, entries); }
function persistCategories(){ saveJSON(CATEGORY_KEY, categories); syncState('categories', categories); }
function persistPeople(){ saveJSON(PEOPLE_KEY, people); syncState('people', people); }
function persistConfig(){ saveJSON(CONFIG_KEY, config); } // gasUrl自体は接続先の設定なので同期しない
function persistFixed(){ saveJSON(FIXED_KEY, fixedCosts); syncState('fixedCosts', fixedCosts); }
function persistFixedLog(){ saveJSON(FIXED_LOG_KEY, fixedLog); syncState('fixedLog', fixedLog); }
function persistTheme(){ saveJSON(THEME_KEY, themeColors); syncState('themeColors', themeColors); }
function persistLifeplan(){ saveJSON(LIFEPLAN_KEY, lifeplan); syncState('lifeplan', lifeplan); }

/* 「設定」系のデータ（費目・固定費・予算・ライフプランなど）をまとめて
   GAS の Settings シートへ送る薄いラッパー。データ本体（entries）は
   1件ずつ addEntry/updateEntry/deleteEntry で送るので対象外。 */
function syncState(key, value){
  syncToGAS('setState', { key, value: JSON.stringify(value) });
}

/* ---- テーマカラー適用 ----
   自分／配偶者それぞれが好きな色を選べるようにし、
   「入力者」として選ばれている方の色がページ全体のアクセントカラーになる。
   識別用のドット色（--self-color/--spouse-color）は常に両方反映しておく。 */
function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function tint(hex, amount){
  const {r,g,b} = hexToRgb(hex);
  const mix = c => Math.round(c + (255-c)*amount);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
function applyTheme(){
  const root = document.documentElement;
  root.style.setProperty('--self-color', themeColors.self);
  root.style.setProperty('--spouse-color', themeColors.spouse);
  const accent = themeColors[state.currentPerson] || themeColors.self;
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-dim', tint(accent, 0.87));
}

/* ---- 固定費の自動生成 ----
   毎月ほぼ同額の費用（家賃・電気代・保険料など）をテンプレート登録しておくと、
   起動のたびに「まだ記録されていない月」の分だけ自動で家計簿エントリを作る。
   金額を編集しても、すでに生成済みの月の記録は変更しない（履歴を保つため）。
   個別の月だけ金額を直したい場合は、生成された記録自体を編集すればよい。 */
function nextMonth(mk){
  let [y,m] = mk.split('-').map(Number);
  m++; if(m>12){ m=1; y++; }
  return `${y}-${String(m).padStart(2,'0')}`;
}
function prevMonth(mk){
  let [y,m] = mk.split('-').map(Number);
  m--; if(m<1){ m=12; y--; }
  return `${y}-${String(m).padStart(2,'0')}`;
}
function generateFixedEntries(){
  const curMonth = todayStr().slice(0,7);
  let changed = false;
  fixedCosts.forEach(f=>{
    if(!fixedLog[f.id]) fixedLog[f.id] = [];
    let m = f.startMonth || curMonth;
    let guard = 0;
    while(m <= curMonth && guard < 1200){
      guard++;
      if(!fixedLog[f.id].includes(m)){
        // IDを「固定費ID＋月」で決めておく。夫婦の端末が同じ月に同時に自動入力しても、
        // 同じ明細として扱われ、二重に記録されない。
        const entryId = `fx_${f.id}_${m}`;
        const alreadyThere = entries.some(e => e.id === entryId || (e.fixedId === f.id && monthKey(e.date) === m));
        if(!alreadyThere){
          const [y, mm] = m.split('-').map(Number);
          const lastDay = new Date(y, mm, 0).getDate();
          const useDay = Math.min(parseInt(f.dayOfMonth) || 1, lastDay);
          const date = `${y}-${String(mm).padStart(2,'0')}-${String(useDay).padStart(2,'0')}`;
          const entry = {
            id: entryId, date, person: f.person, type: f.type, category: f.category,
            amount: f.amount, memo: f.memo || '', createdAt: new Date().toISOString(),
            fixedId: f.id
          };
          entries.push(entry);
          syncToGAS('addEntry', entry);
        }
        fixedLog[f.id].push(m);
        changed = true;
      }
      m = nextMonth(m);
    }
  });
  if(changed){ persistEntries(); persistFixedLog(); }
}

/* 以前の版で、同じ固定費・同じ月の明細が二重に作られてしまった分を片付ける。
   固定費から自動生成された明細（fixedId あり）だけが対象で、日付・金額・費目・
   入力者がすべて同じものだけを削除する（どれを残すかは全端末で同じ基準で決める）。 */
function dedupeFixedEntries(){
  const groups = new Map();
  entries.forEach(e=>{
    if(!e.fixedId) return;
    const key = e.fixedId + '|' + monthKey(e.date);
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  });
  const removeIds = [];
  groups.forEach(list=>{
    if(list.length < 2) return;
    list.sort((a, b) =>
      (a.id.startsWith('fx_') ? 0 : 1) - (b.id.startsWith('fx_') ? 0 : 1)
      || String(a.createdAt || '').localeCompare(String(b.createdAt || ''))
      || a.id.localeCompare(b.id));
    const keep = list[0];
    list.slice(1).forEach(e=>{
      if(e.date === keep.date && e.amount === keep.amount && e.category === keep.category
         && e.type === keep.type && e.person === keep.person) removeIds.push(e.id);
    });
  });
  if(!removeIds.length) return;
  const drop = new Set(removeIds);
  entries = entries.filter(e => !drop.has(e.id));
  persistEntries();
  removeIds.forEach(id => syncToGAS('deleteEntry', { id }));
}

function fmtYen(n){
  const sign = n < 0 ? '-' : '';
  return sign + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normalizeDateString(d){
  if(!d) return d;
  const s = String(d);
  if(s.length <= 10) return s;
  // スプレッドシート側でDate型に変換された値はUTCのISO文字列で返ってくる
  // （例: JST 2026-09-07 00:00 が "2026-09-06T15:00:00.000Z" になる）。
  // JSTに戻してから日付部分だけを取り出す。
  const dt = new Date(s);
  if(isNaN(dt.getTime())) return s.slice(0,10);
  const jst = new Date(dt.getTime() + 9*60*60*1000);
  return jst.toISOString().slice(0,10);
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(mk){
  const [y,m] = mk.split('-');
  return `${y}年${parseInt(m)}月`;
}
function personColor(p){ return p==='self' ? 'var(--self-color)' : 'var(--spouse-color)'; }
function personName(p){ return people[p] || p; }

function showToast(msg, ms){

  clearTimeout(showToast._timer);

}

/* 月ごとの収入・支出・積立投資の合計。積立投資は支出に含めない。 */
function aggregateByMonth(list){
  const byMonth = {};
  list.forEach(e=>{
    const mk = monthKey(e.date);
    if(!byMonth[mk]) byMonth[mk] = {income:0, expense:0, invest:0};
    if(e.type === 'expense' && e.category === INVEST_CATEGORY) byMonth[mk].invest += e.amount;
    else byMonth[mk][e.type] += e.amount;
  });
  return byMonth;
}

  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function validateEntryInput(date, amount){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || date < '2000-01-01') return '日付が正しくありません（2000年以降で入力してください）';
  if(!isFinite(amount) || amount > 1000000000) return '金額が大きすぎます（10億円以下で入力してください）';
  return '';
}

function onSubmitEntry(ev){
  ev.preventDefault();
  const date = document.getElementById('fDate').value;
  const category = document.getElementById('fCategory').value;
  const amount = parseFloat(document.getElementById('fAmount').value);
  const memo = document.getElementById('fMemo').value.trim();
  if(!date || !amount || amount <= 0){
    showToast('日付と金額を確認してください');
    return;
  }
  const entryError = validateEntryInput(date, amount);
  if(entryError){ showToast(entryError, 3500); return; }
  if(date > futureLimitStr() && !confirm(`${date} は先の日付です。このまま記録しますか？`)) return;
  if(state.editingId){
    const idx = entries.findIndex(e=>e.id===state.editingId);
    if(idx !== -1){
      entries[idx] = { ...entries[idx], date, category, amount, memo, type: state.type };
      persistEntries();
      syncToGAS('updateEntry', entries[idx]);
      showToast('更新しました');
    }
    state.editingId = null;
  } else {
    const entry = {
      id: uid(),
      date, person: state.currentPerson, type: state.type,
      category, amount, memo, createdAt: new Date().toISOString()
    };
    entries.push(entry);
    persistEntries();
    syncToGAS('addEntry', entry);

    const makeFixed = document.getElementById('fMakeFixed')?.checked;
    if(makeFixed){
      // 今回入力した分はこの手入力そのものが「今月分」を兼ねるので、
      // 固定費の自動生成は翌月分から始める（今月分が二重に記録されるのを防ぐ）。
      const dayOfMonth = parseInt(date.split('-')[2], 10) || 1;
      fixedCosts.push({
        id: uid(), type: state.type, person: state.currentPerson,
        category, amount, dayOfMonth, memo,
        startMonth: nextMonth(monthKey(date))
      });
      persistFixed();
      generateFixedEntries();
      showToast('記録しました。来月以降も固定費として自動入力します');
    } else {
      showToast('記録しました');
    }
  }
  state.selectedMonth = monthKey(date);
  renderLedgerTab();
}

function startEditEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  state.editingId = id;
  state.type = e.type;
  renderLedgerTab();
  const form = document.getElementById('entryForm');
  if(form) form.scrollIntoView({behavior:'smooth', block:'start'});
}

function deleteEntry(id){
  const idx = entries.findIndex(e=>e.id===id);
  if(idx===-1) return;
  entries.splice(idx,1);
  if(state.editingId === id) state.editingId = null;
  persistEntries();
  syncToGAS('deleteEntry', { id });
  showToast('削除しました');
  renderLedgerTab();
}

/* =========================================================
   グラフ（SVGで自前描画・外部ライブラリ不使用）
   ========================================================= */
function renderChart(months, byMonth){
  const wrap = document.getElementById('chartWrap');
  if(months.length === 0){
    wrap.innerHTML = '<div class="empty-note">まだデータがありません。入力するとここにグラフが表示されます。</div>';
    return;
  }
  const barGroupW = 56;
  const w = Math.max(320, months.length * barGroupW + 40);
  const h = 180;
  const padBottom = 24;
  const padTop = 10;
  const maxVal = Math.max(1, ...months.map(mk => Math.max(byMonth[mk].income, byMonth[mk].expense)));
  const scale = (h - padTop - padBottom) / maxVal;

  let bars = '';
  months.forEach((mk, i)=>{
    const gx = 20 + i * barGroupW;
    const inc = byMonth[mk].income, exp = byMonth[mk].expense;
    const incH = inc * scale, expH = exp * scale;
    const selected = mk === state.selectedMonth;
    bars += `
      <g class="month-group" data-month="${mk}" style="cursor:pointer">
        <rect x="${gx}" y="${h - padBottom - incH}" width="18" height="${incH}" rx="3"
          fill="var(--income)" class="bar" opacity="${selected?1:0.85}"/>
        <rect x="${gx+22}" y="${h - padBottom - expH}" width="18" height="${expH}" rx="3"
          fill="var(--expense)" class="bar" opacity="${selected?1:0.85}"/>
        ${selected ? `<rect x="${gx-4}" y="${padTop-4}" width="48" height="${h-padTop-padBottom+8}" fill="none" stroke="var(--accent)" stroke-dasharray="3,3" rx="6"/>` : ''}
        <text x="${gx+20}" y="${h-6}" text-anchor="middle" class="axis-label">${mk.slice(2).replace('-','/')}</text>
      </g>`;
  });

  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${bars}</svg>`;

  wrap.querySelectorAll('.month-group').forEach(g=>{
    g.addEventListener('click', ()=>{
      state.selectedMonth = g.dataset.month;
      renderChartSelectionOnly();
      renderDetail(visibleEntries());
    });
  });
}
function renderChartSelectionOnly(){
  // re-render chart highlight without full page rebuild
  const byMonth = aggregateByMonth(visibleEntries());
  renderChart(Object.keys(byMonth).sort(), byMonth);
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   分析タブ
   -----------------------------------------------------------
   指定した期間（開始月〜終了月）の実績を、収入・支出それぞれ
   費目別に集計し、期間中の月平均・合計を一覧表示する。予算との
   比較などは行わない、実績の振り返り・傾向把握に特化した機能。
   ========================================================= */
function monthsBetween(startMk, endMk){
  const months = [];
  let m = startMk;
  let guard = 0;
  while(m <= endMk && guard < 1200){
    months.push(m);
    m = nextMonth(m);
    guard++;
  }
  return months;
}

function computeAnalysis(startMk, endMk, person){
  const monthCount = Math.max(1, monthsBetween(startMk, endMk).length);
  const byCatExpense = {};
  const byCatIncome = {};
  let totalInvest = 0;
  entries.forEach(e=>{
    const mk = monthKey(e.date);
    if(mk < startMk || mk > endMk) return;
    if(person !== 'combined' && e.person !== person) return;
    if(e.type === 'expense' && e.category === INVEST_CATEGORY){ totalInvest += e.amount; return; }
    const bucket = e.type === 'expense' ? byCatExpense : byCatIncome;
    bucket[e.category] = (bucket[e.category] || 0) + e.amount;
  });
  const toRows = (byCat) => Object.keys(byCat).map(cat=>({
    category: cat, total: byCat[cat], avg: byCat[cat] / monthCount
  })).sort((a,b)=> b.total - a.total);
  const expenseRows = toRows(byCatExpense);
  const incomeRows = toRows(byCatIncome);
  const totalExpense = expenseRows.reduce((s,r)=>s+r.total, 0);
  const totalIncome = incomeRows.reduce((s,r)=>s+r.total, 0);
  return {
    monthCount, expenseRows, incomeRows, totalExpense, totalIncome, totalInvest,
    avgExpense: totalExpense / monthCount,
    avgIncome: totalIncome / monthCount,
    avgInvest: totalInvest / monthCount,
  };
}

function setAnalysisPreset(preset){
  const end = todayStr().slice(0,7);
  let start;
  if(preset === 'ytd'){
    start = end.slice(0,4) + '-01';
  } else if(preset === 'all'){
    const allMonths = entries.map(e=>monthKey(e.date)).sort();
    start = allMonths.length ? allMonths[0] : end;
  } else {
    const n = parseInt(preset, 10);
    start = end;
    for(let i=0; i<n-1; i++) start = prevMonth(start);
  }
  state.analysisStart = start;
  state.analysisEnd = end;
  renderAnalysisTab();
}

/* ---- 計画（ライフプラン）と実績（家計簿）の月別円グラフ ---- */
const PIE_COLORS = {
  '食費':'#3f7a5c','光熱・水道':'#2f6f8f','家具・日用品':'#7a5fae','被服・美容':'#c2578b',
  '保健医療・保険':'#c1553e','交通・通信':'#a9762c','教養娯楽':'#5f7a3f','交際費':'#2f8f8f',
  'お小遣い・子供':'#d08a3c','住居':'#6b7770','教育':'#4f5fae','介護・仕送り':'#8a5a44',
  '老後の生活費':'#3a6e8a','その他':'#a3aca7',
  '積立投資':'#1f5f8b','貯金（残り）':'#8fc3a6','貯金・積立（残り）':'#8fc3a6'
};
const LEDGER_TO_PIE_GROUP = {
  '食費':'食費','日用品費':'家具・日用品','被服及び履物費':'被服・美容','美容費':'被服・美容',
  '娯楽費':'教養娯楽','交通費':'交通・通信','住居費':'住居','電気代':'光熱・水道','ガス代':'光熱・水道',
  '水道代':'光熱・水道','医療費':'保健医療・保険','保険料':'保健医療・保険','教育費':'教育','積立投資':'積立投資','その他':'その他'
};

// 円グラフの各項目の詳細（タップで表示）。{ plan: {項目名: {value, pct, parts}}, actual: {...} }
let pieDetailData = { plan: {}, actual: {} };

function renderDonut(groups, centerLabel, side, partsMap){
  const items = Object.keys(groups).map(k=>({ name:k, value:groups[k] })).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const total = items.reduce((s,x)=>s+x.value, 0);
  if(!total) return '<div class="empty-note">支出データがありません</div>';
  pieDetailData[side] = {};
  items.forEach(x=>{
    const parts = partsMap && partsMap[x.name]
      ? Object.keys(partsMap[x.name]).map(n=>({ name:n, value:partsMap[x.name][n] })).sort((a,b)=>b.value-a.value)
      : [];
    pieDetailData[side][x.name] = { value:x.value, pct:x.value/total*100, parts };
  });
  const R = 70, r = 42, cx = 80, cy = 80;
  let angle = -Math.PI/2;
  const paths = items.map(x=>{
    const color = PIE_COLORS[x.name] || '#a3aca7';
    const attrs = `class="pie-slice" data-side="${side}" data-name="${escapeHtml(x.name)}"`;
    if(items.length === 1) return `<circle ${attrs} cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${color}" stroke-width="${R-r}"/>`;
    const a0 = angle, a1 = angle + (x.value/total) * Math.PI*2;
    angle = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const pt = (rad, a) => `${(cx + rad*Math.cos(a)).toFixed(2)},${(cy + rad*Math.sin(a)).toFixed(2)}`;
    return `<path ${attrs} d="M${pt(R,a0)} A${R},${R} 0 ${large} 1 ${pt(R,a1)} L${pt(r,a1)} A${r},${r} 0 ${large} 0 ${pt(r,a0)} Z" fill="${color}"/>`;
  }).join('');
  const legend = items.map(x=>`
    <div class="pie-legend-row" role="button" tabindex="0" data-side="${side}" data-name="${escapeHtml(x.name)}">
      <span class="pie-dot" style="background:${PIE_COLORS[x.name] || '#a3aca7'}"></span>
      <span class="pie-name">${escapeHtml(x.name)}</span>
      <span class="pie-val">${fmtYen(x.value)}<span class="pie-pct">${(x.value/total*100).toFixed(1)}%</span></span>
    </div>`).join('');
  return `
    <div class="pie-wrap">
      <svg viewBox="0 0 160 160" class="pie-svg" data-side="${side}" role="img" aria-label="支出の内訳">
        ${paths}
        <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="9" fill="var(--text-dim)">${centerLabel || '支出合計'}</text>
        <text x="${cx}" y="${cy+11}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${fmtYen(total)}</text>
      </svg>
      <div class="pie-legend">${legend}</div>
    </div>
    <div class="pie-detail" data-side="${side}">円グラフや項目をタップすると、内訳が表示されます。</div>`;
}

/* 円グラフの項目をタップしたとき、選んだ項目を強調して内訳を表示する（もう一度タップで解除）。 */
function selectPieItem(side, name){
  const box = document.querySelector(`.pie-detail[data-side="${side}"]`);
  const svg = document.querySelector(`.pie-svg[data-side="${side}"]`);
  const d = pieDetailData[side] && pieDetailData[side][name];
  if(!box || !svg || !d) return;
  const already = box.dataset.sel === name;
  box.dataset.sel = already ? '' : name;
  document.querySelectorAll(`.pie-slice[data-side="${side}"], .pie-legend-row[data-side="${side}"]`).forEach(el=>{
    el.classList.toggle('sel', !already && el.dataset.name === name);
  });
  svg.classList.toggle('has-sel', !already);
  if(already){
    box.innerHTML = '円グラフや項目をタップすると、内訳が表示されます。';
    return;
  }
  box.innerHTML = `<b>${escapeHtml(name)}</b>　${fmtYen(d.value)}（${d.pct.toFixed(1)}%）`
    + (d.parts.length > 1 || (d.parts.length === 1 && d.parts[0].name !== name)
      ? `<div class="pie-parts">${d.parts.map(p=>`<span>${escapeHtml(p.name)} ${fmtYen(p.value)}</span>`).join('')}</div>` : '');
}
function wirePieInteractions(){
  document.querySelectorAll('.pie-slice, .pie-legend-row').forEach(el=>{
    el.addEventListener('click', ()=> selectPieItem(el.dataset.side, el.dataset.name));
    if(el.classList.contains('pie-legend-row')){
      el.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectPieItem(el.dataset.side, el.dataset.name); }
      });
    }
  });
}

function renderPieComparisonCards(){
  if(!state.pieMonth) state.pieMonth = todayStr().slice(0,7);
  const mk = state.pieMonth;
  const year = parseInt(mk.slice(0,4), 10);
  pieDetailData = { plan: {}, actual: {} };

  const planRows = computeLifePlanProjection();
  const planRow = planRows ? planRows.find(r => r.year === year) : null;
  let planBody;
  if(!planRows){
    planBody = '<div class="empty-note">ライフプランが未設定です。ライフプランタブで設定すると、ここに月あたりの計画が表示されます。</div>';
  } else if(!planRow){
    planBody = `<div class="empty-note">${year}年はライフプランの計画期間外です。</div>`;
  } else {
    const groups = {};
    const parts = {};
    Object.keys(planRow.expenseGroups).forEach(k=>{
      groups[k] = planRow.expenseGroups[k] / 12;
      parts[k] = {};
      Object.keys(planRow.expenseParts[k] || {}).forEach(n=>{ parts[k][n] = planRow.expenseParts[k][n] / 12; });
    });
    const inc = planRow.income / 12, exp = planRow.expense / 12, inv = planRow.investContribution / 12;
    const remain = inc - exp - inv;
    if(inv > 0) groups['積立投資'] = inv;
    if(remain > 0) groups['貯金（残り）'] = remain;
    planBody = `
      <div class="pie-summary">
        <span>収入 <b class="income">${fmtYen(inc)}</b></span>
        <span>支出 <b class="expense">${fmtYen(exp)}</b></span>
        <span>積立投資 <b>${fmtYen(inv)}</b></span>
        <span>${remain >= 0 ? '貯金（残り）' : '不足'} <b class="${remain >= 0 ? '' : 'expense'}">${fmtYen(Math.abs(remain))}</b></span>
      </div>
      ${renderDonut(groups, remain >= 0 ? '収入' : '支出＋積立', 'plan', parts)}
      <div class="sync-status">${year}年のライフプランの年額を12で割った月平均です（年が変わると、その年の計画に切り替わります）。</div>`;
  }

  const groups = {};
  const parts = {};
  let inc = 0, exp = 0, actualInv = 0;
  entries.forEach(e=>{
    if(monthKey(e.date) !== mk) return;
    if(e.type === 'income'){ inc += e.amount; return; }
    if(e.category === INVEST_CATEGORY){ actualInv += e.amount; groups['積立投資'] = (groups['積立投資']||0) + e.amount; return; }
    exp += e.amount;
    const g = LEDGER_TO_PIE_GROUP[e.category] || 'その他';
    groups[g] = (groups[g]||0) + e.amount;
    if(!parts[g]) parts[g] = {};
    parts[g][e.category] = (parts[g][e.category]||0) + e.amount;
  });
  const actualRemain = inc - exp - actualInv;
  if(actualRemain > 0) groups['貯金（残り）'] = actualRemain;
  const actualBody = `
    <div class="pie-summary">
      <span>収入 <b class="income">${fmtYen(inc)}</b></span>
      <span>支出 <b class="expense">${fmtYen(exp)}</b></span>
      <span>積立投資 <b>${fmtYen(actualInv)}</b></span>
      <span>${actualRemain >= 0 ? '貯金（残り）' : '不足'} <b class="${actualRemain >= 0 ? '' : 'expense'}">${fmtYen(Math.abs(actualRemain))}</b></span>
    </div>
    ${renderDonut(groups, actualRemain >= 0 ? '収入' : '支出＋積立', 'actual', parts)}
    <div class="sync-status">家計簿に記録した${monthLabel(mk)}の実績です（ホスト・ゲスト合算）。</div>`;

  return `
    <div class="card">
      <h2>計画と実績の比較（月別）</h2>
      <label for="pieMonthInput">比較する月</label>
      <div class="month-nav">
        <button type="button" id="pieMonthPrev" aria-label="前の月へ">‹</button>
        <input type="month" id="pieMonthInput" value="${mk}">
        <button type="button" id="pieMonthNext" aria-label="次の月へ">›</button>
      </div>
    </div>
    <div class="card"><h2>計画（ライフプラン）${monthLabel(mk)}</h2>${planBody}</div>
    <div class="card"><h2>実績（家計簿）${monthLabel(mk)}</h2>${actualBody}</div>`;
}

  const main = document.getElementById('mainArea');
  const viewToggleHtml = `
    <div class="type-toggle analysis-views" id="analysisViewToggle" role="tablist">
      ${[['month','月別の比較'],['period','期間の集計']].map(([key,label])=>
        `<button type="button" role="tab" aria-selected="${state.analysisView===key}" data-view="${key}" class="${state.analysisView===key?'active':''}">${label}</button>`
      ).join('')}

  ).join('');

  const rowHtml = (r) => `

  const expenseHtml = expenseRows.length ? expenseRows.map(rowHtml).join('') : '<div class="empty-note">この期間の支出データがありません</div>';
  const incomeHtml = incomeRows.length ? incomeRows.map(rowHtml).join('') : '<div class="empty-note">この期間の収入データがありません</div>';

  main.innerHTML = `

/* =========================================================
   ライフプランタブ
   -----------------------------------------------------------
   家計簿とは別軸の独立したシミュレーション。「基本設定」で入力した
   月あたりの収入・支出を基準値として使い、そこに住宅ローン・教育費・
   車の買い替え・保険・その他イベントといった増減要因を年ごとに重ねて、
   100歳までの資産推移を概算する。家計簿の実績はここには反映されない
   （逆に、ここで立てた計画を基準に家計簿の使いすぎを確認する使い方を
   想定している）。あくまで目安のシミュレーションであり、税金や社会
   保険料の詳細、運用の暴落・市場変動などは考慮しない簡易モデル。

   一度設定したらほとんど変更しない項目が多いため、入力項目は
   すべて「設定ページ」（renderLifeplanSettingsPage）にまとめ、
   ライフプランタブを開いたときは基本的にダッシュボード
   （renderLifeplanDashboard、グラフと要約のみ）を表示する。
   ========================================================= */
let lifeplanRows = null;
let lifeplanView = 'dashboard'; // 'dashboard' | 'settings'

function mortgageAnnualPayment(balance, years, ratePct){
  if(balance <= 0 || years <= 0) return 0;
  const r = ratePct/100;
  if(r === 0) return balance/years;
  return balance * r / (1 - Math.pow(1+r, -years));
}

/* 1人分の年収を計算する。育休などの「収入が減る期間」が該当する年は
   その期間に指定された月収をそのまま使い、それ以外は通常の昇給
   （年率複利 or 定額）カーブに沿って計算する。育休が明けた翌年以降は、
   育休がなかった場合と同じ経過年数ベースの昇給カーブに戻る
   （育休期間中も「時が止まる」わけではない、という単純化）。 */
function computePersonIncomeForYear(person, year, i){
  const leave = (person.leaves||[]).find(l => year >= l.startYear && year < l.startYear + Math.max(1, l.years||1));
  if(leave) return (leave.monthlyIncome||0) * 12;
  const baseAnnual = (person.monthlyIncome||0) * 12;
  if(person.incomeGrowthMode === 'fixed'){
    return baseAnnual + (person.incomeGrowthFixed||0) * i;
  }
  const growthFactor = Math.pow(1 + (person.incomeGrowthRate||0)/100, i);
  return baseAnnual * growthFactor;
}

function educationExpenseForYear(year){
  let total = 0;
  lifeplan.children.forEach(child=>{
    const age = year - child.birthYear;
    Object.keys(EDU_COST_REF).forEach(stageKey=>{
      const stage = EDU_COST_REF[stageKey];
      const endAge = stage.startAge + stage.years - 1;
      if(age >= stage.startAge && age <= endAge){
        const choice = child.edu[stageKey] || 'public';
        const override = child.eduCost && child.eduCost[stageKey];
        total += (override != null && override > 0) ? override : stage[choice];
      }
    });
  });
  return total;
}

/* 「子供が独立する年齢」未満の子供の人数。お小遣い・子供の生活費は
   この人数に比例させることで、独立に伴う支出の減少を自動的に反映する。 */
function activeChildrenCount(year){
  const indAge = lifeplan.expenses.childIndependenceAge || 22;
  return lifeplan.children.filter(c=>{
    const age = year - c.birthYear;
    return age >= 0 && age < indAge;
  }).length;
}

function computeLifePlanProjection(){
  if(!lifeplan.currentAge) return null;
  const startYear = new Date().getFullYear();
  const yearsToProject = Math.max(1, 100 - lifeplan.currentAge + 1);
  const infl = lifeplan.inflationRate/100;

  let mortgageBalance = lifeplan.mortgage.balance;
  const mortgagePayment = mortgageAnnualPayment(lifeplan.mortgage.balance, lifeplan.mortgage.years, lifeplan.mortgage.rate);
  let mortgageYearsLeft = lifeplan.mortgage.years;

  let realEstateValue = lifeplan.realEstate.price;
  let cash = lifeplan.initialCash || 0;
  const invBalances = {};
  lifeplan.investments.forEach(inv => invBalances[inv.id] = inv.startingBalance || 0);
  const insuranceAnnualTotal = lifeplan.insurances.reduce((s,i)=> s + (i.annualPremium||0), 0);

  // 自分・配偶者それぞれの年齢とリタイア年齢。配偶者の欄が空なら自分と同じとみなす。
  const rt = lifeplan.retirement;
  const spouseAge0 = lifeplan.spouseAge || lifeplan.currentAge;
  const selfRetireAge = rt.retireAge;
  const spouseRetireAge = rt.spouseRetireAge || rt.retireAge;
  // 年金は世帯の金額を入力してもらい、配偶者分の割合で二人に分ける。
  // 「今の物価での金額」なので、それぞれのリタイア時点までインフレ換算する。
  // 受給開始後は物価に連動して増えない（マクロ経済スライドで実質目減りする）ため固定。
  const spouseShare = Math.min(100, Math.max(0, rt.spouseShare == null ? 50 : rt.spouseShare)) / 100;
  const pensionSelf = (rt.pensionAnnual || 0) * (1 - spouseShare)
    * Math.pow(1+infl, Math.max(0, selfRetireAge - lifeplan.currentAge));
  const pensionSpouse = (rt.pensionAnnual || 0) * spouseShare
    * Math.pow(1+infl, Math.max(0, spouseRetireAge - spouseAge0));
  const withdrawTypes = Array.isArray(lifeplan.withdrawTypes) ? lifeplan.withdrawTypes : ['nisa_tsumitate'];

  const rows = [];
  for(let i=0; i<yearsToProject; i++){
    const year = startYear + i;
    const age = lifeplan.currentAge + i;
    const selfRetired = age >= selfRetireAge;
    const spouseRetired = (spouseAge0 + i) >= spouseRetireAge;
    const isRetired = selfRetired && spouseRetired; // 二人ともリタイア済み（生活費が「老後の生活費」に切り替わる）
    const inflationFactor = Math.pow(1+infl, i);

    let income = (selfRetired ? pensionSelf : computePersonIncomeForYear(lifeplan.baseline.self, year, i))
               + (spouseRetired ? pensionSpouse : computePersonIncomeForYear(lifeplan.baseline.spouse, year, i));
    let bonus = 0;
    if(age === lifeplan.retirementBonus.age && lifeplan.retirementBonus.amount > 0){
      bonus = lifeplan.retirementBonus.amount;
      income += bonus;
    }

    const ex = lifeplan.expenses;
    let baseLiving;
    if(isRetired){
      baseLiving = lifeplan.retirement.livingCostAnnual;
    } else {
      const nKids = activeChildrenCount(year);
      const monthlyTotal = (ex.foodMonthly||0) + (ex.utilitiesMonthly||0) + (ex.furnitureMonthly||0)
        + (ex.clothingMonthly||0) + (ex.medicalMonthly||0)
        + (ex.transportMonthly||0) + (ex.communicationMonthly||0) + (ex.carLoanParkingMonthly||0)
        + (ex.hobbyMonthly||0) + (ex.socialMonthly||0)
        + (ex.selfAllowance||0) + (ex.spouseAllowance||0)
        + nKids * ((ex.childAllowancePerChild||0) + (ex.childLivingCostPerChild||0))
        + (ex.contingencyMonthly||0);
      baseLiving = monthlyTotal * 12 + (ex.travelAnnual||0);
    }
    baseLiving *= inflationFactor;

    // 親の介護費用（自分の年齢が開始年齢に達してから、指定年数の間。0年＝期限なし）
    let parentCareCost = 0;
    if(ex.parentCare && ex.parentCare.annualCost > 0 && ex.parentCare.startAge > 0 && age >= ex.parentCare.startAge){
      const years = ex.parentCare.years || 0;
      if(years <= 0 || age < ex.parentCare.startAge + years){
        parentCareCost = ex.parentCare.annualCost * inflationFactor;
      }
    }
    // 実家などへの仕送り（開始年齢〜終了年齢。終了年齢0＝期限なし）
    let remittanceCost = 0;
    if(ex.remittance && ex.remittance.monthlyAmount > 0 && age >= (ex.remittance.startAge||0)){
      const endAge = ex.remittance.endAge || 0;
      if(endAge <= 0 || age <= endAge){
        remittanceCost = ex.remittance.monthlyAmount * 12 * inflationFactor;
      }
    }
    const ceremonyCost = (ex.ceremonyAnnual||0) * inflationFactor;

    let mortgageCost = 0;
    if(mortgageBalance > 0 && mortgageYearsLeft > 0){
      const interest = mortgageBalance * (lifeplan.mortgage.rate/100);
      let principal = mortgagePayment - interest;
      if(principal > mortgageBalance) principal = mortgageBalance;
      if(principal < 0) principal = 0;
      mortgageCost = interest + principal;
      mortgageBalance = Math.max(0, mortgageBalance - principal);
      mortgageYearsLeft--;
    }

    if(i > 0) realEstateValue *= (1 + lifeplan.realEstate.appreciationRate/100);
    const realEstateNet = Math.max(0, realEstateValue - mortgageBalance);

    let carCost = 0;
    if(lifeplan.car.cycleYears > 0 && i > 0 && i % lifeplan.car.cycleYears === 0){
      carCost = lifeplan.car.cost * inflationFactor;
    }

    const eduCost = educationExpenseForYear(year) * inflationFactor;

    let eventCost = 0;
    lifeplan.otherEvents.forEach(ev=>{ if(ev.year === year) eventCost += ev.amount; });

    let investContribution = 0;
    const investTotals = { nisa_tsumitate:0, nisa_growth:0, ideco:0, taxable:0, child_nisa:0 };
    lifeplan.investments.forEach(inv=>{
      const annualAmount = isRetired ? 0 : (inv.monthlyAmount||0) * 12;
      invBalances[inv.id] = invBalances[inv.id] * (1 + (inv.returnRate||0)/100) + annualAmount;
      investContribution += annualAmount;
      investTotals[inv.type] = (investTotals[inv.type]||0) + invBalances[inv.id];
    });

    const insuranceCost = insuranceAnnualTotal * inflationFactor;
    const totalExpense = baseLiving + mortgageCost + carCost + eduCost + eventCost + insuranceCost
      + parentCareCost + remittanceCost + ceremonyCost;
    const netCashFlow = income - totalExpense - investContribution;
    cash += netCashFlow;

    // 円グラフ用の支出内訳（年額・インフレ反映済み）。家計簿の費目と比べやすい区分にまとめ、
    // 各区分がどの設定項目から来た金額かも expenseParts に残す（円グラフのタップ表示用）。
    const expenseGroups = {};
    const expenseParts = {};
    const addGroup = (k, v, src) => {
      if(!(v > 0)) return;
      expenseGroups[k] = (expenseGroups[k]||0) + v;
      if(!expenseParts[k]) expenseParts[k] = {};
      expenseParts[k][src || k] = (expenseParts[k][src || k]||0) + v;
    };
    const gf = inflationFactor;
    if(isRetired){
      addGroup('老後の生活費', lifeplan.retirement.livingCostAnnual * gf, '老後の生活費');
    } else {
      const nKids = activeChildrenCount(year);
      addGroup('食費', (ex.foodMonthly||0) * 12 * gf, '食費');
      addGroup('光熱・水道', (ex.utilitiesMonthly||0) * 12 * gf, '光熱・水道費');
      addGroup('家具・日用品', (ex.furnitureMonthly||0) * 12 * gf, '家具・家事用品');
      addGroup('被服・美容', (ex.clothingMonthly||0) * 12 * gf, '被服及び履物');
      addGroup('交通・通信', (ex.transportMonthly||0) * 12 * gf, '交通費');
      addGroup('交通・通信', (ex.communicationMonthly||0) * 12 * gf, '通信費');
      addGroup('交通・通信', (ex.carLoanParkingMonthly||0) * 12 * gf, '車のローン・駐車場');
      addGroup('教養娯楽', (ex.hobbyMonthly||0) * 12 * gf, '趣味・娯楽');
      addGroup('教養娯楽', (ex.travelAnnual||0) * gf, '旅行');
      addGroup('交際費', (ex.socialMonthly||0) * 12 * gf, '交際費');
      addGroup('お小遣い・子供', ((ex.selfAllowance||0) + (ex.spouseAllowance||0)) * 12 * gf, '夫婦のお小遣い');
      addGroup('お小遣い・子供', nKids * ((ex.childAllowancePerChild||0) + (ex.childLivingCostPerChild||0)) * 12 * gf, '子供のお小遣い・生活費');
      addGroup('その他', (ex.contingencyMonthly||0) * 12 * gf, '予備費');
      addGroup('保健医療・保険', (ex.medicalMonthly||0) * 12 * gf, '医療費');
    }
    addGroup('保健医療・保険', insuranceCost, '保険料');
    addGroup('交通・通信', carCost, '車の買い替え');
    addGroup('住居', mortgageCost, '住宅ローン');
    addGroup('教育', eduCost, '教育費');
    addGroup('介護・仕送り', parentCareCost, '親の介護');
    addGroup('介護・仕送り', remittanceCost, '仕送り');
    addGroup('交際費', ceremonyCost, '冠婚葬祭');
    addGroup('その他', eventCost, 'その他のイベント費用');

    // 貯金が下限（生活防衛資金）を下回ったら、その分だけ設定で選んだ投資枠から
    // 取り崩して補う。貯金がマイナスのまま資産だけ増え続けるのは非現実的なため
    // （残高が足りない場合はそこまでの取り崩しになる）。
    let investWithdrawal = 0;
    const withdrawalParts = {};
    const minCash = lifeplan.minCashReserve || 0;
    const belowReserve = cash < minCash;
    if(belowReserve){
      let shortfall = minCash - cash;
      WITHDRAW_ORDER.forEach(type=>{
        if(!withdrawTypes.includes(type)) return;
        lifeplan.investments.forEach(inv=>{
          if(shortfall <= 0 || inv.type !== type) return;
          const take = Math.min(invBalances[inv.id] || 0, shortfall);
          if(take > 0){
            invBalances[inv.id] -= take;
            investTotals[type] -= take;
            shortfall -= take;
            investWithdrawal += take;
            withdrawalParts[type] = (withdrawalParts[type] || 0) + take;
          }
        });
      });
      cash += investWithdrawal;
    }

    // 資産＝貯金（現金）＋株式等の投資額の合計。不動産（マンション等）は
    // 評価額が不確実で流動性も低いため、あえて「資産」の合計には含めない
    // （不動産純資産は realEstateNet として別途保持し、参考値として扱う）。
    const totalAssets = cash + investTotals.nisa_tsumitate + investTotals.nisa_growth + investTotals.ideco + investTotals.taxable + investTotals.child_nisa;

    rows.push({ year, age, income, expense: totalExpense, netCashFlow, cash, invest: investTotals, realEstateNet, totalAssets, mortgageBalance, isRetired, selfRetired, spouseRetired, bonus, investWithdrawal, withdrawalParts, belowReserve, expenseGroups, expenseParts, investContribution });
  }
  return rows;
}

function renderLifeplanTab(){
  if(lifeplanView === 'settings') renderLifeplanSettingsPage();
  else renderLifeplanDashboard();
}

/* 設定画面を開く前に、必ずスプレッドシート側の最新データを取得し直す。
   ライフプランは夫婦で1つの共有データを丸ごと上書きする方式のため、
   取得し直さずに古いデータのまま保存すると、相手が別の端末で入力した
   内容を消してしまう事故につながる（実際に発生したため対策として追加）。 */
async function openLifeplanSettings(){
  // 通信中は何も起きていないように見えて連打されがちなので、
  // 押した瞬間にボタンを読み込み中の見た目にしておく。
  const btn = document.getElementById('btnLifeplanSettings');
  if(btn){ btn.disabled = true; btn.textContent = '読み込み中…'; }
  if(config.gasUrl){
    const ok = await pullFromGAS();
    if(ok === false) showToast('最新の内容を取得できなかったため、この端末の内容で開きます。保存前に更新ボタンで同期することをおすすめします');
  }
  lifeplanView = 'settings';
  renderLifeplanTab();
}

/* 今後の「大きな支出を伴うライフイベント」を、直近の年から順に返す
   （その他大きなイベント／車の買い替え／子供の入学）。過去分は除く。 */
function computeUpcomingLifeEvents(){
  if(!lifeplan.currentAge) return [];
  const currentYear = new Date().getFullYear();
  const events = [];

  lifeplan.otherEvents.forEach(ev=>{
    if(ev.year >= currentYear) events.push({ year: ev.year, label: ev.name, amount: ev.amount });
  });

  if(lifeplan.car.cycleYears > 0 && lifeplan.car.cost > 0){
    events.push({ year: currentYear + lifeplan.car.cycleYears, label:'車の買い替え', amount: lifeplan.car.cost });
    events.push({ year: currentYear + lifeplan.car.cycleYears*2, label:'車の買い替え', amount: lifeplan.car.cost });
  }

  lifeplan.children.forEach(child=>{
    Object.keys(EDU_COST_REF).forEach(stageKey=>{
      const stage = EDU_COST_REF[stageKey];
      const year = child.birthYear + stage.startAge;
      if(year < currentYear) return;
      const choice = child.edu[stageKey] || 'public';
      const override = child.eduCost && child.eduCost[stageKey];
      const amount = (override != null && override > 0) ? override : stage[choice];
      events.push({ year, label:`${child.name} ${stage.label}入学`, amount });
    });
  });

  events.sort((a,b)=> a.year - b.year);
  return events.slice(0, 2);
}

function renderLifeplanDashboard(){
  const main = document.getElementById('mainArea');
  lifeplanRows = computeLifePlanProjection();

  // 資金ショートは3段階に分けて示す。
  // 1. 取り崩す年：投資から実際に取り崩しが発生する最初の年
  // 2. 生活防衛資金が下回る年：貯金が下限を割り込む最初の年（取り崩す原資が
  //    なければ①より先に起こることもある）
  // 3. 生活防衛資金が枯渇する年：取り崩し対象の投資の残高がゼロになる最初の年
  const withdrawalRow = lifeplanRows ? lifeplanRows.find(r => r.investWithdrawal > 0) : null;
  const reserveBreachRow = lifeplanRows ? lifeplanRows.find(r => r.belowReserve) : null;
  let nisaDepletedRow = null;
  if(lifeplanRows){
    const srcTypes = WITHDRAW_ORDER.filter(t => (lifeplan.withdrawTypes || []).includes(t));
    const balanceOf = r => srcTypes.reduce((s, t) => s + (r.invest[t] || 0), 0);
    let prevBalance = lifeplan.investments
      .filter(inv => srcTypes.includes(inv.type))
      .reduce((s, inv) => s + (inv.startingBalance || 0), 0);
    for(const r of lifeplanRows){
      if(prevBalance > 0 && balanceOf(r) <= 0){ nisaDepletedRow = r; break; }
      prevBalance = balanceOf(r);
    }
  }
  const upcomingEvents = lifeplanRows ? computeUpcomingLifeEvents() : [];
  const currentYear = new Date().getFullYear();

  main.innerHTML = `
    ${!lifeplanRows ? `
      <div class="card">
        <h2>ライフプラン</h2>
        <div class="empty-note">まだライフプランが設定されていません。「設定を編集」から年齢・インフレ率・住宅ローンなどを入力してください。</div>
        <button type="button" class="submit-btn" id="btnLifeplanSettings" style="width:100%;margin-top:12px;">設定を編集する</button>
      </div>
    ` : `
      <div class="card">
        <h2>今後の大きな支出予定</h2>
        ${upcomingEvents.length ? upcomingEvents.map(ev => `
          <div class="score-comment" style="text-align:left;margin-bottom:6px;">
            <strong>${ev.year}年（${lifeplan.currentAge + (ev.year - currentYear)}歳）</strong>　${escapeHtml(ev.label)}　${fmtYen(ev.amount)}
          </div>
        `).join('') : `<div class="empty-note">今後の大きな支出予定は登録されていません。</div>`}
      </div>

      <div class="card">
        <h2>資金ショートのチェック</h2>
        ${(withdrawalRow || reserveBreachRow) ? `
          ${withdrawalRow ? `
            <div class="score-comment" style="color:var(--expense);font-weight:700;">
              ⚠ ${withdrawalRow.year}年（${withdrawalRow.age}歳）に、${withdrawSourceLabel()}からの取り崩しが発生する見込みです。
            </div>
          ` : ''}
          ${reserveBreachRow ? `
            <div class="score-comment" style="color:var(--expense);font-weight:700;">
              ⚠ ${reserveBreachRow.year}年（${reserveBreachRow.age}歳）に、貯金が生活防衛資金（${fmtYen(lifeplan.minCashReserve||0)}）を下回る見込みです。
            </div>
          ` : ''}
          ${nisaDepletedRow ? `
            <div class="score-comment" style="color:var(--expense);font-weight:700;">

/* 目盛りに使う「きりのいい」間隔を選ぶ（1・2・5・10 の倍率で最大値を3分割程度に）。 */
function niceAxisStep(maxVal){
  if(maxVal <= 0) return 10000;
  const rough = maxVal / 3;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return step * mag;
}
function fmtManYen(v){
  // 1億円以上は桁数が多くなりすぎるため「億円」表示に切り替える（小数第1位まで）。
  if(Math.abs(v) >= 100000000){
    return (v/100000000).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '億円';
  }
  return Math.round(v/10000).toLocaleString('ja-JP') + '万円';
}

/* 0円のラインを基準に、収入・支出を上向きに並べて表示し、資産（貯金＋株式等の
   投資額。不動産は含めない）を下向きに伸ばす棒グラフ。資産は何十年分もの
   累計額なので、1年分の収入・支出とは桁が大きく異なりやすい（支出を適切に
   見積もっていれば、資産の伸びも現実的な範囲に収まりやすい）。
   縦軸に目盛り（万円単位）を表示し、各年の棒をタップするとその年の
   正確な金額を下の詳細欄に表示する。 */
function renderLifeplanCombinedChart(rows){
  const wrap = document.getElementById('lifeplanCombinedChart');
  if(!wrap) return;
  const barGroupW = 22;
  const padLeft = 64, padTop = 10, padBottom = 22;
  const w = Math.max(320, rows.length*barGroupW + padLeft + 14);
  const h = 240;
  const usable = h - padTop - padBottom;

  const assetOf = r => r.totalAssets; // 貯金＋株式等の投資額の合計（不動産は含まない）
  const maxUp = Math.max(1, ...rows.map(r => Math.max(r.income, r.expense)));
  const maxDown = Math.max(1, ...rows.map(r => Math.max(0, assetOf(r))));
  const scale = usable / (maxUp + maxDown);
  const zeroY = padTop + maxUp*scale;

  const scaleX = i => padLeft + i*barGroupW;

  let bars = '', hitAreas = '';
  rows.forEach((r,i)=>{
    const gx = scaleX(i);
    // 退職金は一度きりの収入なので、通常の収入とは別の薄い色で上に積んで表示する。
    const bonusH = Math.max(0, r.bonus || 0)*scale;
    const incH = Math.max(0, r.income - (r.bonus || 0))*scale;
    const expH = Math.max(0, r.expense)*scale;
    const assetH = Math.max(0, assetOf(r))*scale;
    bars += `
      <rect x="${gx}" y="${zeroY-incH}" width="7" height="${incH}" fill="var(--income)" opacity="0.85"/>
      ${bonusH > 0 ? `<rect x="${gx}" y="${zeroY-incH-bonusH}" width="7" height="${bonusH}" fill="var(--income)" fill-opacity="0.3" stroke="var(--income)" stroke-width="1" stroke-dasharray="2,2"/>` : ''}
      <rect x="${gx+8}" y="${zeroY-expH}" width="7" height="${expH}" fill="var(--expense)" opacity="0.85"/>
      <rect x="${gx}" y="${zeroY}" width="7" height="${assetH}" fill="#ffffff" stroke="${ASSET_SERIES_COLORS.total}" stroke-width="1.5" stroke-dasharray="3,2"/>`;
    hitAreas += `<rect class="lp-bar-hit" data-i="${i}" x="${gx-3}" y="${padTop}" width="${barGroupW}" height="${usable}" fill="transparent" style="cursor:pointer;"/>`;
  });

  let labels = '';
  rows.forEach((r,i)=>{
    if(i % 5 === 0) labels += `<text x="${scaleX(i)+7}" y="${h-6}" text-anchor="middle" class="axis-label">${r.year}</text>`;
  });

  // 縦軸の目盛り（0円のラインから上＝収入・支出、下＝資産、それぞれ独立した縮尺）。
  // 上下で桁が大きく異なる場合、細かい目盛りが密集して文字が重なってしまうため、
  // 直前に描いたラベルと十分な間隔（フォントの高さ以上）が空くものだけを描画する。
  const MIN_LABEL_GAP = 11;
  let axis = `<text x="${padLeft-6}" y="${zeroY+3}" text-anchor="end" class="axis-label">0円</text>`;
  let lastLabelY = zeroY;
  const upStep = niceAxisStep(maxUp);
  for(let v=upStep; v<=maxUp*1.02; v+=upStep){
    const y = zeroY - v*scale;
    if(Math.abs(lastLabelY - y) < MIN_LABEL_GAP) continue;
    axis += `<line x1="${padLeft}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>`;
    axis += `<text x="${padLeft-6}" y="${y+3}" text-anchor="end" class="axis-label">${fmtManYen(v)}</text>`;
    lastLabelY = y;
  }
  lastLabelY = zeroY;
  const downStep = niceAxisStep(maxDown);
  for(let v=downStep; v<=maxDown*1.02; v+=downStep){
    const y = zeroY + v*scale;
    if(Math.abs(lastLabelY - y) < MIN_LABEL_GAP) continue;
    axis += `<line x1="${padLeft}" y1="${y}" x2="${w}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>`;
    axis += `<text x="${padLeft-6}" y="${y+3}" text-anchor="end" class="axis-label">${fmtManYen(v)}</text>`;
    lastLabelY = y;
  }

  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    ${axis}
    ${bars}
    <line x1="${padLeft}" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="var(--text-dim)" stroke-width="1"/>
    ${labels}
    ${hitAreas}
  </svg>`;

  wrap.querySelectorAll('.lp-bar-hit').forEach(el=>{
    el.addEventListener('click', ()=> showLifeplanYearDetail(rows[+el.dataset.i]));
  });
}

/* 棒グラフの年をタップしたときに、その年の正確な金額を内訳付きで表示する。 */
function showLifeplanYearDetail(r){
  const box = document.getElementById('lifeplanYearDetail');
  if(!box) return;
  const investParts = Object.keys(INVESTMENT_TYPES)
    .filter(k => r.invest[k])
    .map(k => `${INVESTMENT_TYPES[k]} ${fmtYen(r.invest[k])}`);
  const breakdown = [`貯金 ${fmtYen(r.cash)}`, ...investParts].join('・');
  const withdrawalNote = r.investWithdrawal > 0
    ? `<br><span style="color:var(--expense);">※ 貯金の下限を下回ったため、${Object.keys(r.withdrawalParts).map(k => `${INVESTMENT_TYPES[k]} ${fmtYen(r.withdrawalParts[k])}`).join('・')} を取り崩しました</span>`
    : '';
  const retireLabel = r.isRetired ? '・リタイア後'
    : r.selfRetired ? '・自分がリタイア後'
    : r.spouseRetired ? '・配偶者がリタイア後' : '';
  box.innerHTML = `
    <strong>${r.year}年（${r.age}歳）${retireLabel}</strong><br>
    収入 ${fmtYen(r.income)}${r.bonus > 0 ? `（うち退職金 ${fmtYen(r.bonus)}）` : ''}　支出 ${fmtYen(r.expense)}<br>
    資産合計 ${fmtYen(r.totalAssets)}（${breakdown}）${withdrawalNote}`;
}

function renderChildEduCard(child){

    const stage = EDU_COST_REF[stageKey];

  return `

  document.querySelectorAll('.child-name').forEach(inp=>{

      const c = lifeplan.children.find(x=>x.id===inp.dataset.child);
      if(c) c.name = inp.value.trim() || c.name;
    });
  });
  document.querySelectorAll('.child-birthyear').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = lifeplan.children.find(x=>x.id===inp.dataset.child);
      if(c) c.birthYear = parseInt(inp.value) || c.birthYear;
      collectLifeplanFormValues();
      renderLifeplanSettingsPage();
    });
  });
  document.querySelectorAll('.child-edu-choice').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const c = lifeplan.children.find(x=>x.id===sel.dataset.child);
      if(c) c.edu[sel.dataset.stage] = sel.value;
      collectLifeplanFormValues();
      renderLifeplanSettingsPage();
    });

  document.querySelectorAll('.child-edu-override').forEach(inp=>{

      if(val > 0) c.eduCost[inp.dataset.stage] = val;
      else delete c.eduCost[inp.dataset.stage];

  });
}

        </div>
      </div>
      <div class="form-row">
        <div id="${prefix}GrowthRateField" ${person.incomeGrowthMode==='fixed' ? 'hidden' : ''}>
          <label>収入の伸び率（年率 %）</label>
          <input type="number" step="0.1" id="${prefix}GrowthRate" value="${person.incomeGrowthRate}">
        </div>
        <div id="${prefix}GrowthFixedField" ${person.incomeGrowthMode==='fixed' ? '' : 'hidden'}>
          <label>毎年の昇給額（円/年）</label>
          <input type="number" step="1000" id="${prefix}GrowthFixed" value="${person.incomeGrowthFixed||''}" placeholder="例）50000">
        </div>
      </div>

      <h4 style="font-size:12.5px;color:var(--text-dim);margin:16px 0 8px;font-weight:700;">育休などで収入が減る期間</h4>
