        <div><label>期間（年）</label><input type="number" id="${prefix}LeaveYears" placeholder="例）1"></div>
      </div>
      <div class="form-row">
        <div><label>その間の月収</label><input type="number" id="${prefix}LeaveIncome" placeholder="例）150000"></div>
      </div>
      <button type="button" class="cancel-btn" id="${prefix}BtnAddLeave" style="margin-top:8px;width:100%;">+ 育休などの期間を追加</button>
    </div>
  `;
}

function wireIncomeCard(personKey){
  const prefix = 'lp' + (personKey==='self' ? 'Self' : 'Spouse');

  document.querySelectorAll(`#${prefix}GrowthModeToggle button`).forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(`#${prefix}GrowthModeToggle button`).forEach(b=>b.classList.remove('active','income'));
      btn.classList.add('active','income');
      document.getElementById(`${prefix}GrowthMode`).value = btn.dataset.mode;
      document.getElementById(`${prefix}GrowthRateField`).hidden = (btn.dataset.mode === 'fixed');
      document.getElementById(`${prefix}GrowthFixedField`).hidden = (btn.dataset.mode !== 'fixed');
    };
  });

  document.getElementById(`${prefix}BtnAddLeave`).onclick = ()=>{
    const startYear = parseInt(document.getElementById(`${prefix}LeaveYear`).value);
    const years = parseInt(document.getElementById(`${prefix}LeaveYears`).value);
    const monthlyIncome = parseFloat(document.getElementById(`${prefix}LeaveIncome`).value);
    if(!startYear || !years){ showToast('開始年と期間を入力してください'); return; }
    collectLifeplanFormValues();
    lifeplan.baseline[personKey].leaves.push({ id: uid(), startYear, years, monthlyIncome: monthlyIncome || 0 });
    renderLifeplanSettingsPage();
  };
}

function removeIncomeLeave(personKey, id){
  collectLifeplanFormValues();
  lifeplan.baseline[personKey].leaves = lifeplan.baseline[personKey].leaves.filter(l=>l.id!==id);
  renderLifeplanSettingsPage();
}

/* 生活費の内訳（家計調査の10大費目ベース）。タップで開閉するアコーディオン形式。
   「保健医療」に保険、「交通・通信」に車の買い替え、「教育」に教育費の
   子供カード、「その他の消費支出」にその他イベントを、それぞれ組み込んで

   独立したカードとして残す。
   unit: 'monthly'（月額・そのまま合算）／'annual'（年額・月換算は12で割る）
        ／'meta'（金額ではない設定値、合算対象外）

function expenseFieldRoot(p, f){
  return f.root ? p[f.root] : p.expenses;
}

function expenseFieldValue(p, f){
  let v = expenseFieldRoot(p, f);
  for(const k of f.path) v = (v || {})[k];
  return v;
}

function categoryMonthlySubtotal(p, cat){
  const base = cat.fields.reduce((s,f)=>{
    if(f.unit === 'meta') return s;
    const n = Number(expenseFieldValue(p, f)) || 0;
    return s + (f.unit === 'annual' ? n/12 : n);
  }, 0);
  return base + (cat.extraSubtotal ? cat.extraSubtotal(p) : 0);
}

function renderExpenseCategories(p){
  return EXPENSE_CATEGORIES.map(cat=>{
    const fieldsHtml = cat.fields.map(f => `
      <div class="form-row">
        <div><label>${f.label}</label><input type="number" id="${f.id}" value="${expenseFieldValue(p, f) || ''}" placeholder="${f.placeholder || '0'}"></div>
      </div>`).join('');
    const subLabel = cat.noSubtotal ? '詳細を見る' : `月換算 目安 ${fmtYen(categoryMonthlySubtotal(p, cat))}`;
    return `
      <div class="exp-cat">
        <button type="button" class="exp-cat-head" data-key="${cat.key}">
          <span class="exp-cat-name">${cat.no}. ${cat.title}</span>
          <span class="exp-cat-sub">${subLabel}</span>
          <span class="exp-cat-arrow">▾</span>
        </button>
        <div class="exp-cat-body" id="expBody-${cat.key}" hidden>
          ${fieldsHtml}
          ${cat.extraHtml ? cat.extraHtml(p) : ''}
          ${cat.note ? `<div class="sync-status">${cat.note}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function wireExpenseCategories(p){
  document.querySelectorAll('.exp-cat-head[data-key]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const body = document.getElementById(`expBody-${btn.dataset.key}`);
      if(!body) return;
      const willOpen = body.hidden;
      body.hidden = !willOpen;
      btn.classList.toggle('open', willOpen);
    });
  });
  EXPENSE_CATEGORIES.forEach(cat=>{ if(cat.extraWire) cat.extraWire(p); });
}

function collectExpenseCategoryValues(p){
  const val = (id) => document.getElementById(id);
  EXPENSE_CATEGORIES.forEach(cat=>{
    cat.fields.forEach(f=>{
      const el = val(f.id);
      if(!el) return;
      const n = f.unit === 'meta' ? (parseFloat(el.value) || (f.path[f.path.length-1]==='childIndependenceAge' ? 22 : 0))
        : (parseFloat(el.value) || 0);
      let obj = expenseFieldRoot(p, f);
      for(let i=0;i<f.path.length-1;i++) obj = obj[f.path[i]];
      obj[f.path[f.path.length-1]] = n;
    });
  });
}

/* ライフプラン設定の入力チェック。明らかにおかしい値（マイナスの金額、あり得ない年齢や
   利率など）を保存前に止める。[{ msg, id }] を返し、空なら問題なし。 */
function validateLifeplan(p){
  const errs = [];
  const bad = (msg, id) => errs.push({ msg, id });
  const isNum = v => typeof v === 'number' && isFinite(v);
  const range = (v, lo, hi) => isNum(v) && v >= lo && v <= hi;
  const thisYear = new Date().getFullYear();

  if(p.currentAge != null && !range(p.currentAge, 1, 99)) bad('年齢（自分）は1〜99で入力してください', 'lpAge');
  if(p.spouseAge != null && !range(p.spouseAge, 1, 99)) bad('年齢（配偶者）は1〜99で入力してください', 'lpSpouseAge');
  if(!range(p.inflationRate, -5, 20)) bad('インフレ率は−5〜20%の範囲で入力してください', 'lpInflation');
  if(!range(p.initialCash, 0, 1e10)) bad('現在の貯金額は0以上で入力してください', 'lpInitialCash');
  if(!range(p.minCashReserve, 0, 1e10)) bad('貯金の下限は0以上で入力してください', 'lpMinCashReserve');

  [['self', 'lpSelf', '自分'], ['spouse', 'lpSpouse', '配偶者']].forEach(([k, pre, name])=>{
    const person = p.baseline[k];
    if(!range(person.monthlyIncome, 0, 1e8)) bad(`${name}の月あたりの手取り収入は0以上で入力してください`, `${pre}Income`);
    if(person.incomeGrowthMode === 'fixed'){
      if(!range(person.incomeGrowthFixed, -1e7, 1e7)) bad(`${name}の昇給額（円/年）が大きすぎます`, `${pre}GrowthFixed`);
    } else if(!range(person.incomeGrowthRate, -30, 50)){
      bad(`${name}の収入の伸び率は−30〜50%の範囲で入力してください`, `${pre}GrowthRate`);
    }
    (person.leaves || []).forEach(l=>{
      if(!range(l.monthlyIncome, 0, 1e8) || !range(l.years, 1, 30)) bad(`${name}の育休などの期間の設定が正しくありません`);
    });
  });

  const rt = p.retirement;
  if(!range(rt.retireAge, 30, 100)) bad('リタイア年齢（自分）は30〜100で入力してください', 'lpRetireAge');
  if(rt.spouseRetireAge != null && !range(rt.spouseRetireAge, 30, 100)) bad('リタイア年齢（配偶者）は30〜100で入力してください', 'lpSpouseRetireAge');
  if(!range(rt.pensionAnnual, 0, 1e9)) bad('年金見込み額は0以上で入力してください', 'lpPension');
  if(!range(rt.livingCostAnnual, 0, 1e9)) bad('老後の生活費は0以上で入力してください', 'lpRetireLiving');
  if(!range(p.retirementBonus.amount, 0, 1e10)) bad('退職金の見込み額は0以上で入力してください', 'lpRetireBonus');
  if(!range(p.retirementBonus.age, 30, 100)) bad('退職金の受取年齢は30〜100で入力してください', 'lpRetireBonusAge');

  const META_RANGES = {
    lpMortgageBalance: [0, 1e9], lpMortgageYears: [0, 60], lpMortgageRate: [0, 20],
    lpRePrice: [0, 2e9], lpReRate: [-20, 20], lpCarCycle: [0, 40], lpCarCost: [0, 5e7],
  };
  EXPENSE_CATEGORIES.forEach(cat=>{
    cat.fields.forEach(f=>{
      const v = expenseFieldValue(p, f);
      const key = f.path[f.path.length - 1];
      let lo = 0, hi = f.unit === 'monthly' ? 5e7 : 1e9;
      if(META_RANGES[f.id]) [lo, hi] = META_RANGES[f.id];
      else if(f.unit === 'meta'){
        if(key === 'childIndependenceAge'){ lo = 15; hi = 30; }
        else if(/Age$/.test(key)) hi = 100;
        else if(key === 'years') hi = 60;
      }
      if(!range(v, lo, hi)) bad(hi >= 1e6 ? `「${f.label}」は0以上の、大きすぎない金額で入力してください` : `「${f.label}」は${lo}〜${hi}の範囲で入力してください`, f.id);
    });
  });

  p.children.forEach(c=>{
    if(!range(c.birthYear, 1980, thisYear + 1)) bad(`${c.name}の生まれ年が正しくありません`);
  });
  p.investments.forEach(inv=>{
    const name = inv.name || INVESTMENT_TYPES[inv.type];
    if(!range(inv.returnRate, -20, 30)) bad(`「${name}」の期待年率は−20〜30%の範囲で入力してください`);
    if(!range(inv.monthlyAmount, 0, 1e8) || !range(inv.startingBalance || 0, 0, 1e10)) bad(`「${name}」の金額が正しくありません`);
  });
  p.insurances.forEach(i=>{ if(!range(i.annualPremium, 0, 1e8)) bad(`「${i.name}」の保険料が正しくありません`); });
  p.otherEvents.forEach(ev=>{
    if(!range(ev.year, thisYear - 5, thisYear + 100) || !range(ev.amount, 0, 1e10)) bad(`「${ev.name}」の年または金額が正しくありません`);
  });
  return errs;
}

function showLifeplanErrors(errs){
  errs.forEach(e=>{
    const el = e.id && document.getElementById(e.id);
    if(!el) return;
    el.classList.add('input-error');
    el.addEventListener('input', ()=> el.classList.remove('input-error'), { once: true });
  });
  showToast(`入力を確認してください：${errs[0].msg}${errs.length > 1 ? `（ほか${errs.length - 1}件）` : ''}`, 4500);
  const first = errs.map(e => e.id && document.getElementById(e.id)).find(el => el && el.offsetParent !== null);
  if(first){
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    first.focus({ preventScroll: true });
  }
}

/* フォーム上の未保存の値を lifeplan オブジェクトへ反映する。
   一覧への追加・削除はモーダル全体を再描画するため、その前に必ず
   呼び出して、他の項目に入力中の値が消えないようにする。 */
function collectLifeplanFormValues(){
  const p = lifeplan;
  const val = (id) => document.getElementById(id);
  if(!val('lpMortgageBalance')) return;
  p.currentAge = parseInt(val('lpAge').value) || null;
  p.inflationRate = parseFloat(val('lpInflation').value) || 0;
  p.initialCash = parseFloat(val('lpInitialCash').value) || 0;
  p.minCashReserve = parseFloat(val('lpMinCashReserve').value) || 0;
  ['self','spouse'].forEach(personKey=>{
    const prefix = 'lp' + (personKey==='self' ? 'Self' : 'Spouse');
    const person = p.baseline[personKey];
    if(!val(`${prefix}Income`)) return;
    person.monthlyIncome = parseFloat(val(`${prefix}Income`).value) || 0;
    person.incomeGrowthMode = val(`${prefix}GrowthMode`).value === 'fixed' ? 'fixed' : 'rate';
    person.incomeGrowthRate = parseFloat(val(`${prefix}GrowthRate`).value) || 0;
    person.incomeGrowthFixed = parseFloat(val(`${prefix}GrowthFixed`).value) || 0;
  });
  collectExpenseCategoryValues(p);
  const spouseAgeVal = parseInt(val('lpSpouseAge').value);
  p.spouseAge = spouseAgeVal > 0 ? spouseAgeVal : null;
  p.withdrawTypes = Array.from(document.querySelectorAll('.lp-withdraw-type:checked')).map(x => x.value);
  const spouseRetireVal = parseInt(val('lpSpouseRetireAge').value);
  p.retirement.spouseRetireAge = spouseRetireVal > 0 ? spouseRetireVal : null;
  const shareVal = parseFloat(val('lpSpouseShare').value);
  p.retirement.spouseShare = isNaN(shareVal) ? 50 : Math.min(100, Math.max(0, shareVal));
  p.retirement.pensionAnnual = parseFloat(val('lpPension').value) || 0;
  p.retirement.livingCostAnnual = parseFloat(val('lpRetireLiving').value) || 0;
  p.retirement.retireAge = parseInt(val('lpRetireAge').value) || 65;
  p.retirementBonus.amount = parseFloat(val('lpRetireBonus').value) || 0;
  p.retirementBonus.age = parseInt(val('lpRetireBonusAge').value) || 65;
}

function removeInsurance(id){ collectLifeplanFormValues(); lifeplan.insurances = lifeplan.insurances.filter(x=>x.id!==id); renderLifeplanSettingsPage(); }
function removeInvestment(id){ collectLifeplanFormValues(); lifeplan.investments = lifeplan.investments.filter(x=>x.id!==id); renderLifeplanSettingsPage(); }
function removeOtherEvent(id){ collectLifeplanFormValues(); lifeplan.otherEvents = lifeplan.otherEvents.filter(x=>x.id!==id); renderLifeplanSettingsPage(); }

/* =========================================================

document.getElementById('btnSettings').addEventListener('click', ()=>{ fixedEditingId = null; openSettingsModal(); });

function openSettingsModal(){

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; fixedEditingId = null; }

function renderChips(containerId, type){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  categories[type].forEach((c, idx)=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${escapeHtml(c)} <button type="button" title="削除">✕</button>`;
    chip.querySelector('button').onclick = ()=>{
      categories[type].splice(idx,1);
      renderChips(containerId, type);
    };
    el.appendChild(chip);
  });
}
function renderThemeSwatches(containerId, person){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  THEME_PALETTE.forEach(color=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch' + (themeColors[person] === color ? ' selected' : '');
    b.style.background = color;
    b.title = color;
    b.onclick = ()=> pickThemeColor(person, color);
    el.appendChild(b);
  });
}
function pickThemeColor(person, color){
  themeColors[person] = color;
  persistTheme();
  applyTheme();
  renderThemeSwatches(person==='self' ? 'selfSwatches' : 'spouseSwatches', person);
  const customInput = document.getElementById(person==='self' ? 'selfCustomColor' : 'spouseCustomColor');
  if(customInput) customInput.value = color;
  const dot = document.getElementById(person==='self' ? 'selfThemeDot' : 'spouseThemeDot');
  if(dot) dot.style.background = color;
  renderAll();
}

function addCategory(type, inputId){
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  if(categories[type].includes(val)){ input.value=''; return; }
  categories[type].push(val);
  input.value = '';
  renderChips(type==='expense' ? 'expenseChips' : 'incomeChips', type);
}

/* =========================================================
   手動同期ボタン（配偶者の端末での入力をすぐ確認したい時など、
   アプリを閉じ直さなくても最新データを取得し直せるようにする）
   ========================================================= */
document.getElementById('btnSyncNow').addEventListener('click', async ()=>{
  if(!config.gasUrl){
    showToast('Google Apps Scriptとの連携が設定されていません（設定画面から連携できます）');
    return;
  }
  const btn = document.getElementById('btnSyncNow');
  btn.classList.add('spinning');
  btn.disabled = true;
  try{
    const ok = await pullFromGAS();
    if(ok === false) showToast('同期できませんでした。通信状況や連携の設定を確認してください');
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
});

/* =========================================================
   固定費の管理（設定画面に組み込み）
   登録（新規追加）は家計簿入力画面の「固定費として毎月自動入力する」
   チェックボックスから行う。ここでは一覧の確認・編集・削除のみ扱う。
   ========================================================= */
let fixedEditingId = null; // null=編集フォームなし、それ以外=そのIDを編集中

function renderFixedSection(){
  const editing = fixedEditingId ? fixedCosts.find(f=>f.id===fixedEditingId) : null;

  const listHtml = fixedCosts.length ? fixedCosts.map(f=>`
    <div class="fixed-item">
      <span class="who-dot" style="background:${personColor(f.person)}" title="${personName(f.person)}"></span>
      <div class="main">
        <div class="cat">${escapeHtml(f.category)}<span class="fixed-type ${f.type}">${f.type==='expense'?'支出':'収入'}</span></div>
        <div class="meta">${personName(f.person)} ・ 毎月${f.dayOfMonth}日${f.memo ? ' ・ '+escapeHtml(f.memo) : ''}</div>
      </div>
      <div class="amt ${f.type}">${fmtYen(f.amount)}</div>
      <button class="edit-btn" title="編集" onclick="editFixed('${f.id}')">✎</button>
      <button class="del" title="削除" onclick="removeFixed('${f.id}')">✕</button>
    </div>
  `).join('') : '<div class="empty-note">まだ固定費が登録されていません。家計簿入力画面で「固定費として毎月自動入力する」にチェックを入れると、ここに追加されます。</div>';

  return `
    <div class="field-group">
      <h4>固定費の管理</h4>
      <div class="sync-status" style="margin-bottom:10px;">
        家賃・電気代・保険料など、毎月ほぼ同じ金額のものが並びます。金額が変わったら「編集」してください（すでに記録済みの月は変わらず、今後の月から新しい金額が使われます）。
      </div>
      <div class="fixed-list">${listHtml}</div>
      ${editing ? renderFixedForm(editing) : ''}
    </div>
  `;
}

function wireFixedSection(){
  const editing = fixedEditingId ? fixedCosts.find(f=>f.id===fixedEditingId) : null;
  if(editing) wireFixedForm(editing);
}

function renderFixedForm(editing){
  return `
    <div class="card" style="margin-top:10px;padding:14px;">
      <div class="type-toggle" id="fixedTypeToggle">
        <button type="button" data-type="expense" class="${editing.type==='expense'?'active expense':''}">支出</button>
        <button type="button" data-type="income" class="${editing.type==='income'?'active income':''}">収入</button>
      </div>
      <div class="form-row" style="margin-top:10px;">
        <div>
          <label>入力者</label>
          <select id="fixedPerson">
            <option value="self" ${editing.person==='self' ? 'selected':''}>${escapeHtml(people.self)}</option>
            <option value="spouse" ${editing.person==='spouse' ? 'selected':''}>${escapeHtml(people.spouse)}</option>
          </select>
        </div>
        <div>
          <label>費目</label>
          <select id="fixedCategory"></select>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>金額</label>
          <input type="number" id="fixedAmount" min="0" step="1" value="${editing.amount}" placeholder="0">
        </div>
        <div>
          <label>毎月の日付</label>
          <input type="number" id="fixedDay" min="1" max="31" value="${editing.dayOfMonth}">
        </div>
      </div>
      <div>
        <label>メモ（任意）</label>
        <input type="text" id="fixedMemo" value="${escapeAttr(editing.memo||'')}" placeholder="例）住宅ローン返済">
      </div>
      <div class="modal-close-row" style="margin-top:12px;">
        <button type="button" class="cancel-btn" id="fixedFormCancel">キャンセル</button>
        <button type="button" class="submit-btn" id="fixedFormSave">更新する</button>
      </div>
    </div>
  `;
}

function wireFixedForm(editing){
  const typeToggle = document.getElementById('fixedTypeToggle');
  const catSel = document.getElementById('fixedCategory');
  let curType = editing.type;

  function fillCat(){
    fillCategoryOptions(catSel, curType);
    if(editing.type === curType) catSel.value = editing.category;
  }
  fillCat();

  typeToggle.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      curType = btn.dataset.type;
      typeToggle.querySelectorAll('button').forEach(b=>{
        b.classList.remove('active','expense','income');
      });
      btn.classList.add('active', curType);
      fillCat();
    };
  });

  document.getElementById('fixedFormCancel').onclick = ()=>{ fixedEditingId = null; openSettingsModal(); };
  document.getElementById('fixedFormSave').onclick = ()=>{
    const amount = parseFloat(document.getElementById('fixedAmount').value);
    const day = Math.min(31, Math.max(1, parseInt(document.getElementById('fixedDay').value) || 1));
    const category = catSel.value;
    const person = document.getElementById('fixedPerson').value;
    const memo = document.getElementById('fixedMemo').value.trim();
    if(!amount || amount <= 0 || !category){
      showToast('費目と金額を確認してください');
      return;
    }
    if(amount > 1000000000){ showToast('金額が大きすぎます（10億円以下で入力してください）', 3500); return; }
    Object.assign(editing, { type: curType, person, category, amount, dayOfMonth: day, memo });
    persistFixed();
    showToast('固定費を更新しました');
    fixedEditingId = null;
    generateFixedEntries();
    openSettingsModal();
    renderLedgerTab();
  };
}

function editFixed(id){ fixedEditingId = id; openSettingsModal(); }
function removeFixed(id){
  fixedCosts = fixedCosts.filter(f=>f.id!==id);
  persistFixed();
  openSettingsModal();
  showToast('固定費を削除しました（すでに記録済みの明細は残ります）');
}

/* =========================================================
   タブ切り替え（月次評価・ライフプランは準備中プレースホルダー）
   ========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  if(btn.classList.contains('disabled')) return;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    if(btn.dataset.tab === 'ledger') renderLedgerTab();
    else if(btn.dataset.tab === 'analysis') renderAnalysisTab();
    else if(btn.dataset.tab === 'lifeplan') renderLifeplanTab();
  });
});

/* =========================================================
   アクセシビリティ：ラベルと入力欄の関連付け
   -----------------------------------------------------------
   <label> の直後に入力欄が並ぶ作りが多く、そのままでは読み上げソフトが
   「この欄は何の入力か」を判断できない。画面が描き直されるたびに、
   直後の入力欄と自動で結びつける。 */
let autoFieldSeq = 0;
let labelAssocScheduled = false;
function associateLabels(){
  labelAssocScheduled = false;
  document.querySelectorAll('label:not([for])').forEach(lab=>{
    if(lab.querySelector('input, select, textarea')) return;
    const ctrl = lab.nextElementSibling;
    if(!ctrl || !/^(INPUT|SELECT|TEXTAREA)$/.test(ctrl.tagName)) return;
    if(!ctrl.id) ctrl.id = 'auto-field-' + (++autoFieldSeq);
    lab.htmlFor = ctrl.id;
  });
}
new MutationObserver(()=>{
  if(!labelAssocScheduled){ labelAssocScheduled = true; requestAnimationFrame(associateLabels); }
}).observe(document.body, { childList: true, subtree: true });

/* =========================================================
   初期化
   ========================================================= */
// オフラインでも起動できるよう、画面の本体を端末に保存しておく（sw.js。更新は常に最新を優先）。
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker の登録に失敗しました', err));
}

generateFixedEntries();
dedupeFixedEntries();
applyTheme();
updateSyncBadge();
if(localStorage.getItem('kakeibo_current_person') === null){
  showPersonSetup();
} else {
  renderAll();
}
pullFromGAS(); // 起動時にスプレッドシートの最新内容を取得（GAS URL未設定なら何もしない）
