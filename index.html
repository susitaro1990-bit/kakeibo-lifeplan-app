<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夫婦家計簿 &amp; ライフプラン</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="夫婦家計簿">
<style>
  :root{
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#e2e6e4;
    --text:#1f2a24;
    --text-dim:#6b7770;
    --accent:#3f7a5c;
    --accent-dim:#eaf3ee;
    --income:#3f7a5c;
    --expense:#c1553e;
    --self-color:#3f7a5c;
    --spouse-color:#a9762c;
    --radius:14px;
    --shadow:0 1px 3px rgba(20,30,25,0.06), 0 1px 2px rgba(20,30,25,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:0 14px;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(244,246,245,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:640px;margin:0 auto;padding:12px 14px 8px;
  }
  .title-row{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .title-row h1{
    font-size:16px;font-weight:700;margin:0;letter-spacing:.02em;
  }
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-icon{
    width:32px;height:32px;flex-shrink:0;color:var(--accent);
    filter:drop-shadow(0 1px 1px rgba(20,30,25,0.15));
    transition:color .3s;
  }
  .brand-text h1{
    font-size:17px;font-weight:800;margin:0;letter-spacing:.02em;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    color:var(--text);line-height:1.15;
  }
  .brand-text .brand-sub{
    font-size:9px;letter-spacing:.16em;color:var(--text-dim);
    text-transform:uppercase;font-weight:700;margin-top:1px;
  }
  .icon-group{display:flex;gap:6px;}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    color:var(--text-dim);cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);}

  .person-select{
    display:flex;gap:6px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:3px;
  }
  .person-select button{
    flex:1;border:none;background:none;padding:8px 6px;border-radius:8px;
    font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .person-select button.active{
    background:var(--accent-dim);color:var(--accent);
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  nav.tabs{
    display:flex;gap:4px;margin-top:10px;
  }
  nav.tabs button{
    flex:1;padding:10px 4px;background:none;border:none;
    font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{
    color:var(--accent);border-bottom-color:var(--accent);
  }
  nav.tabs button.disabled{
    color:#bfc7c2;cursor:default;
  }

  main{padding:14px 0 30px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  }
  .card h2{font-size:14px;margin:0 0 12px;color:var(--text);font-weight:700;}
  .section-label{font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}

  .view-toggle{
    display:flex;gap:6px;margin-bottom:14px;
  }
  .view-toggle button{
    flex:1;padding:9px 4px;border:1px solid var(--border);background:var(--card);
    border-radius:10px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;
  }
  .view-toggle button.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }

  .summary-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
  }
  .summary-box{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 8px;text-align:center;
  }
  .summary-box .label{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
  .summary-box .val{font-size:15px;font-weight:700;}
  .val.income{color:var(--income);}
  .val.expense{color:var(--expense);}
  .val.balance.pos{color:var(--income);}
  .val.balance.neg{color:var(--expense);}

  form.entry-form{display:flex;flex-direction:column;gap:10px;}
  .form-row{display:flex;gap:8px;}
  .form-row > div{flex:1;}
  label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;font-weight:600;}
  input, select, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;
    font-size:14px;background:#fbfcfb;color:var(--text);font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-dim);border-color:var(--accent);}
  .type-toggle{display:flex;gap:6px;}
  .type-toggle button{
    flex:1;padding:9px;border:1px solid var(--border);border-radius:9px;background:#fbfcfb;
    font-weight:700;font-size:13px;color:var(--text-dim);cursor:pointer;
  }
  .type-toggle button.active.expense{background:#fbeae6;border-color:var(--expense);color:var(--expense);}
  .type-toggle button.active.income{background:#e9f3ee;border-color:var(--income);color:var(--income);}

  .submit-btn{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:11px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:2px;
  }
  .submit-btn:hover{filter:brightness(1.05);}
  .cancel-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    border-radius:10px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;
  }

  /* chart */
  .chart-wrap{overflow-x:auto;}
  svg.chart{display:block;min-width:100%;}
  .bar{cursor:pointer;}
  .bar:hover{opacity:0.8;}
  .axis-label{font-size:10px;fill:var(--text-dim);}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);margin-top:6px;justify-content:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .month-header{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .month-header .m-label{font-weight:700;font-size:14px;}
  .month-header button{
    background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
    text-decoration:underline;
  }

  .entry-list{display:flex;flex-direction:column;gap:6px;}
  .entry-item{
    display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);
    border-radius:10px;background:#fbfcfb;
  }
  .entry-item .who-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .entry-item .main{flex:1;min-width:0;}
  .entry-item .cat{font-size:13px;font-weight:700;}
  .entry-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-item .amt{font-size:14px;font-weight:700;white-space:nowrap;}
  .entry-item .amt.income{color:var(--income);}
  .entry-item .amt.expense{color:var(--expense);}
  .entry-item .del{
    background:none;border:none;color:#c8ccc9;font-size:16px;cursor:pointer;padding:2px 4px;
  }
  .entry-item .del:hover{color:var(--expense);}
  .empty-note{color:var(--text-dim);font-size:13px;text-align:center;padding:20px 0;}

  .placeholder{
    text-align:center;padding:60px 20px;color:var(--text-dim);
  }
  .placeholder .big{font-size:28px;margin-bottom:10px;}
  .placeholder h3{color:var(--text);margin:0 0 6px;font-size:15px;}
  .placeholder p{font-size:13px;line-height:1.6;margin:0;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,30,25,0.4);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media (min-width:640px){
    .modal-overlay{align-items:center;}
  }
  .modal{
    background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;
    padding:18px;max-height:85vh;overflow-y:auto;
  }
  @media (min-width:640px){
    .modal{border-radius:16px;}
  }
  .modal h3{margin:0 0 14px;font-size:15px;}
  .modal-close-row{display:flex;justify-content:flex-end;margin-top:14px;gap:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{
    display:flex;align-items:center;gap:6px;background:var(--accent-dim);color:var(--accent);
    padding:6px 10px;border-radius:20px;font-size:12.5px;font-weight:600;
  }
  .chip button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0;}
  .add-chip-row{display:flex;gap:6px;}
  .add-chip-row input{flex:1;}
  .add-chip-row button{
    background:var(--accent);color:#fff;border:none;border-radius:9px;padding:0 14px;font-weight:700;cursor:pointer;
  }
  .field-group{margin-bottom:16px;}
  .field-group h4{font-size:12.5px;color:var(--text-dim);margin:0 0 8px;font-weight:700;}
  .name-edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .name-edit-row .dot{width:10px;height:10px;}
  .sync-status{font-size:11.5px;color:var(--text-dim);margin-top:10px;line-height:1.6;}
  .sync-status code{background:var(--accent-dim);padding:1px 5px;border-radius:5px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#1f2a24;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .fixed-badge{
    display:inline-block;font-size:10px;font-weight:700;color:var(--accent);
    background:var(--accent-dim);padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle;
  }
  .entry-item .edit-btn{
    background:none;border:none;color:#b7bdb9;font-size:14px;cursor:pointer;padding:2px 4px;
  }
  .entry-item .edit-btn:hover{color:var(--accent);}
  .fixed-list{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
  .fixed-item{
    display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);
    border-radius:10px;background:#fbfcfb;
  }
  .fixed-item .main{flex:1;min-width:0;}
  .fixed-item .cat{font-size:13px;font-weight:700;}
  .fixed-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .fixed-item .amt{font-size:13.5px;font-weight:700;white-space:nowrap;}
  .fixed-item .amt.income{color:var(--income);}
  .fixed-item .amt.expense{color:var(--expense);}
  .fixed-type{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px;}
  .fixed-type.expense{background:#fbeae6;color:var(--expense);}
  .fixed-type.income{background:#e9f3ee;color:var(--income);}

  .theme-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .theme-row-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;min-width:76px;}
  .swatch-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .swatch{
    width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
    box-shadow:0 0 0 1px rgba(20,30,25,0.08);
  }
  .swatch.selected{border-color:#fff;box-shadow:0 0 0 2px var(--text);}
  .custom-color{
    width:30px;height:26px;padding:0;border:1px solid var(--border);border-radius:8px;cursor:pointer;
    background:none;
  }

  .score-wrap{text-align:center;padding:6px 0 4px;}
  .score-num{font-size:48px;font-weight:800;line-height:1;color:var(--text);}
  .score-num.good{color:var(--income);}
  .score-num.warn{color:#c98a2c;}
  .score-num.bad{color:var(--expense);}
  .score-unit{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .score-comment{font-size:13px;color:var(--text-dim);text-align:center;margin-top:8px;}

  .eval-item{margin-bottom:14px;}
  .eval-item:last-child{margin-bottom:0;}
  .eval-item-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px;gap:8px;}
  .eval-cat{font-weight:700;flex-shrink:0;}
  .eval-amt{color:var(--text-dim);font-size:12px;white-space:nowrap;}
  .eval-bar-track{height:8px;background:var(--accent-dim);border-radius:4px;overflow:hidden;}
  .eval-bar-fill{height:100%;background:var(--income);border-radius:4px;transition:width .3s;}
  .eval-bar-fill.over{background:var(--expense);}

  .budget-row{display:flex;gap:10px;align-items:center;}
  .budget-row label{flex:1;margin:0;font-size:13px;font-weight:600;color:var(--text);}
  .budget-row input{width:120px;}

  .asset-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center;}
  .asset-legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .asset-legend-item input{margin:0;}
  .legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex-shrink:0;}
  .child-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fbfcfb;}
  .edu-stage-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .edu-stage-label{width:52px;flex-shrink:0;font-size:12.5px;font-weight:700;}
  .edu-stage-row select{flex:2;}
  .edu-stage-row input{flex:1;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="title-row">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="currentColor"/>
          <circle cx="20" cy="20" r="18" fill="none" stroke="#000" stroke-width="1" opacity="0.12"/>
          <circle cx="20" cy="20" r="14.5" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
          <text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-family="Georgia,'Hiragino Mincho ProN',serif" font-size="21" font-weight="700" fill="#fff">¥</text>
        </svg>
        <div class="brand-text">
          <h1>夫婦家計簿</h1>
          <div class="brand-sub">Kakeibo Ledger</div>
        </div>
      </div>
      <div class="icon-group">
        <button class="icon-btn" id="btnFixed" title="固定費の管理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btnSettings" title="設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="person-select" id="personSelect"></div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="ledger">家計簿入力</button>
      <button class="tab-btn" data-tab="evaluation">月次評価</button>
      <button class="tab-btn" data-tab="lifeplan">ライフプラン</button>
    </nav>
  </div>
</header>

<div class="app">
<main id="mainArea"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   データレイヤー（将来 Google Apps Script に差し替え予定）
   -----------------------------------------------------------
   今はブラウザの localStorage を「台帳」として使い、
   すべての更新は syncToGAS() 経由でも呼び出す形にしておく。
   GAS_URL を設定すれば、そのまま実際のスプレッドシートに
   書き込む構成へ移行できる（POST/GET の疎通確認用スタブ）。
   ========================================================= */
const STORAGE_KEY = 'kakeibo_entries_v1';
const CATEGORY_KEY = 'kakeibo_categories_v1';
const PEOPLE_KEY = 'kakeibo_people_v1';
const CONFIG_KEY = 'kakeibo_config_v1';
const FIXED_KEY = 'kakeibo_fixed_v1';
const FIXED_LOG_KEY = 'kakeibo_fixed_log_v1';
const THEME_KEY = 'kakeibo_theme_v1';
const BUDGET_KEY = 'kakeibo_budgets_v1';

const DEFAULT_THEME_COLORS = { self: '#3f7a5c', spouse: '#a9762c' };
const THEME_PALETTE = ['#3f7a5c','#2f6f8f','#7a5fae','#c1573f','#c2578b','#2f8f8f','#a9762c','#5f7a3f'];

const DEFAULT_CATEGORIES = {
  expense: ['食費','日用品費','娯楽費','交通費','住居費','電気代','ガス代','水道代','医療費','教育費','保険料','その他'],
  income: ['給与','賞与','副業','その他収入']
};
const DEFAULT_PEOPLE = { self: '自分', spouse: '配偶者' };
const DEFAULT_CONFIG = { gasUrl: '', gasSecret: '' };
const LIFEPLAN_KEY = 'kakeibo_lifeplan_v1';

/* 教育費の目安（年額・円）。あくまで一般的な統計に基づく参考値で、自由に上書き可能。 */
const EDU_COST_REF = {
  kindergarten: { label: '幼稚園', startAge: 3, years: 3, public: 220000, private: 530000 },
  elementary:   { label: '小学校', startAge: 6, years: 6, public: 350000, private: 1670000 },
  juniorhigh:   { label: '中学校', startAge: 12, years: 3, public: 540000, private: 1430000 },
  highschool:   { label: '高校',   startAge: 15, years: 3, public: 510000, private: 1050000 },
  university:   { label: '大学',   startAge: 18, years: 4, public: 600000, private: 1150000 },
};
const INVESTMENT_TYPES = {
  nisa_tsumitate: 'つみたてNISA枠',
  nisa_growth: '成長投資枠',
  ideco: 'iDeCo',
  taxable: '課税投資枠',
};
const ASSET_SERIES_COLORS = {
  cash: '#3f7a5c',
  nisa_tsumitate: '#2f6f8f',
  nisa_growth: '#7a5fae',
  ideco: '#c1573f',
  taxable: '#c2578b',
  realEstate: '#5f7a3f',
  total: '#1f2a24',
};

function defaultPersonIncome(){
  return { monthlyIncome: 0, incomeGrowthMode: 'rate', incomeGrowthRate: 1, incomeGrowthFixed: 0, leaves: [] };
}

function defaultLifeplan(){
  return {
    currentAge: null,
    inflationRate: 2,
    baseline: {

/* 古いバージョンの保存データに baseline や incomeGrowthRate が
   欠けているケースを補う（新しい項目を追加するたびにここも更新する）。
   2026-09時点：baseline.monthlyIncome が直接持たれていた旧構造から、
   自分／配偶者それぞれの収入を持つ baseline.self / baseline.spouse
   構造へ移行する処理も兼ねる。 */
function normalizeLifeplanBaseline(p){
  if(!p.baseline) p.baseline = { monthlyExpense: 0, self: defaultPersonIncome(), spouse: defaultPersonIncome() };
  const b = p.baseline;
  if(!b.self){
    // 旧構造（単一の世帯収入）が残っている場合は「自分」の収入として引き継ぐ
    b.self = defaultPersonIncome();
    if(b.monthlyIncome != null) b.self.monthlyIncome = b.monthlyIncome;
    if(b.incomeGrowthMode != null) b.self.incomeGrowthMode = b.incomeGrowthMode;
    if(b.incomeGrowthRate != null) b.self.incomeGrowthRate = b.incomeGrowthRate;
    if(b.incomeGrowthFixed != null) b.self.incomeGrowthFixed = b.incomeGrowthFixed;
    delete b.monthlyIncome; delete b.incomeGrowthMode; delete b.incomeGrowthRate; delete b.incomeGrowthFixed;
  }
  if(!b.spouse) b.spouse = defaultPersonIncome();
  [b.self, b.spouse].forEach(person=>{
    if(person.incomeGrowthRate == null) person.incomeGrowthRate = 1;
    if(person.incomeGrowthMode == null) person.incomeGrowthMode = 'rate';
    if(person.incomeGrowthFixed == null) person.incomeGrowthFixed = 0;
    if(!person.leaves) person.leaves = [];
  });
}

function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return structuredClone(fallback);
    return JSON.parse(raw);
  }catch(e){ return structuredClone(fallback); }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

/* ---- GAS 連携スタブ ----
   CONFIG.gasUrl が空の間はローカル保存のみで動作し、
   コンソールに送信予定の内容をログするだけの「疎通確認ダミー」。
   実際の GAS Web App を作ったら gasUrl を設定するだけで
   下の fetch が有効になる想定。 */
async function syncToGAS(action, payload){
  if(!config.gasUrl){
    console.log('[GAS dummy sync]', action, payload);
    return { status:'ok', dummy:true };
  }
  try{
    const res = await fetch(config.gasUrl, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain' },
      body: JSON.stringify({ action, payload, secret: config.gasSecret || '' })
    });
    return await res.json().catch(()=>({status:'ok'}));
  }catch(e){
    console.error('GAS sync failed', e);
    showToast('GAS同期に失敗しました（ローカルには保存済み）');
    return { status:'error', error:String(e) };
  }
}

/* ---- 起動時にスプレッドシートから取得 ----
   GAS Web App URL が設定されていれば、起動時に一度だけ GET して
   スプレッドシート側の最新内容（家計簿の全件＋設定類）を取り込む。
   スプレッドシートを「正」とみなし、ローカルの値を上書きする
   （＝配偶者の端末で行われた変更もここで反映される）。
   取得に失敗しても致命的にはせず、ローカルのデータで動作を続ける。 */
async function pullFromGAS(){
  if(!config.gasUrl) return;
  try{
    const url = config.gasUrl + '?secret=' + encodeURIComponent(config.gasSecret || '');
    const res = await fetch(url, { method:'GET' });
    const data = await res.json();
    if(Array.isArray(data.entries)){
      // GAS/スプレッドシート側で日付が Date 型に自動変換され、
      // ISO日時（例: 2026-09-06T15:00:00.000Z）のまま返ってくることがあるため、
      // 念のためアプリ側でも "YYYY-MM-DD" に正規化しておく。
      entries = data.entries.map(e=>({
        ...e,
        amount: Number(e.amount) || 0,
        date: normalizeDateString(e.date),
      }));
      saveJSON(STORAGE_KEY, entries);
    }
    const st = data.state || {};
    const applyState = (key, setter) => {
      if(st[key] == null) return;
      try{ setter(JSON.parse(st[key])); }catch(err){ console.error('failed to parse GAS state for', key, err); }
    };
    applyState('categories', v=>{ categories = v; saveJSON(CATEGORY_KEY, categories); });
    applyState('people', v=>{ people = v; saveJSON(PEOPLE_KEY, people); });
    applyState('fixedCosts', v=>{ fixedCosts = v; saveJSON(FIXED_KEY, fixedCosts); });
    applyState('fixedLog', v=>{ fixedLog = v; saveJSON(FIXED_LOG_KEY, fixedLog); });
    applyState('budgets', v=>{ budgets = v; saveJSON(BUDGET_KEY, budgets); });
    applyState('themeColors', v=>{ themeColors = v; saveJSON(THEME_KEY, themeColors); });
    applyState('lifeplan', v=>{ lifeplan = v; normalizeLifeplanBaseline(lifeplan); saveJSON(LIFEPLAN_KEY, lifeplan); });

    generateFixedEntries();
    applyTheme();
    const activeTabBtn = document.querySelector('.tab-btn.active');
    const activeTab = activeTabBtn ? activeTabBtn.dataset.tab : 'ledger';
    if(activeTab === 'evaluation') renderEvaluationTab();
    else if(activeTab === 'lifeplan') renderLifeplanTab();
    else renderAll();
    showToast('スプレッドシートと同期しました');
  }catch(e){
    console.error('GAS pull failed', e);
  }
}

function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function persistEntries(){ saveJSON(STORAGE_KEY, entries); }
function persistCategories(){ saveJSON(CATEGORY_KEY, categories); syncState('categories', categories); }
function persistPeople(){ saveJSON(PEOPLE_KEY, people); syncState('people', people); }
function persistConfig(){ saveJSON(CONFIG_KEY, config); } // gasUrl自体は接続先の設定なので同期しない
function persistFixed(){ saveJSON(FIXED_KEY, fixedCosts); syncState('fixedCosts', fixedCosts); }
function persistFixedLog(){ saveJSON(FIXED_LOG_KEY, fixedLog); syncState('fixedLog', fixedLog); }
function persistTheme(){ saveJSON(THEME_KEY, themeColors); syncState('themeColors', themeColors); }
function persistBudgets(){ saveJSON(BUDGET_KEY, budgets); syncState('budgets', budgets); }
function persistLifeplan(){ saveJSON(LIFEPLAN_KEY, lifeplan); syncState('lifeplan', lifeplan); }

/* 「設定」系のデータ（費目・固定費・予算・ライフプランなど）をまとめて
   GAS の Settings シートへ送る薄いラッパー。データ本体（entries）は
   1件ずつ addEntry/updateEntry/deleteEntry で送るので対象外。 */
function syncState(key, value){
  syncToGAS('setState', { key, value: JSON.stringify(value) });
}

/* ---- テーマカラー適用 ----
   自分／配偶者それぞれが好きな色を選べるようにし、
   「入力者」として選ばれている方の色がページ全体のアクセントカラーになる。
   識別用のドット色（--self-color/--spouse-color）は常に両方反映しておく。 */
function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function tint(hex, amount){
  const {r,g,b} = hexToRgb(hex);
  const mix = c => Math.round(c + (255-c)*amount);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
function applyTheme(){
  const root = document.documentElement;
  root.style.setProperty('--self-color', themeColors.self);
  root.style.setProperty('--spouse-color', themeColors.spouse);
  const accent = themeColors[state.currentPerson] || themeColors.self;
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-dim', tint(accent, 0.87));
}

/* ---- 固定費の自動生成 ----
   毎月ほぼ同額の費用（家賃・電気代・保険料など）をテンプレート登録しておくと、
   起動のたびに「まだ記録されていない月」の分だけ自動で家計簿エントリを作る。
   金額を編集しても、すでに生成済みの月の記録は変更しない（履歴を保つため）。
   個別の月だけ金額を直したい場合は、生成された記録自体を編集すればよい。 */
function nextMonth(mk){
  let [y,m] = mk.split('-').map(Number);
  m++; if(m>12){ m=1; y++; }
  return `${y}-${String(m).padStart(2,'0')}`;
}
function generateFixedEntries(){
  const curMonth = todayStr().slice(0,7);
  let changed = false;
  fixedCosts.forEach(f=>{
    if(!fixedLog[f.id]) fixedLog[f.id] = [];
    let m = f.startMonth || curMonth;
    let guard = 0;
    while(m <= curMonth && guard < 1200){
      guard++;
      if(!fixedLog[f.id].includes(m)){
        const [y, mm] = m.split('-').map(Number);
        const lastDay = new Date(y, mm, 0).getDate();
        const useDay = Math.min(parseInt(f.dayOfMonth) || 1, lastDay);
        const date = `${y}-${String(mm).padStart(2,'0')}-${String(useDay).padStart(2,'0')}`;
        const entry = {
          id: uid(), date, person: f.person, type: f.type, category: f.category,
          amount: f.amount, memo: f.memo || '', createdAt: new Date().toISOString(),
          fixedId: f.id
        };
        entries.push(entry);
        fixedLog[f.id].push(m);
        changed = true;
        syncToGAS('addEntry', entry);
      }
      m = nextMonth(m);
    }
  });
  if(changed){ persistEntries(); persistFixedLog(); }
}

/* =========================================================
   ユーティリティ
   ========================================================= */
function fmtYen(n){
  const sign = n < 0 ? '-' : '';
  return sign + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function normalizeDateString(d){
  if(!d) return d;
  const s = String(d);
  if(s.length <= 10) return s;
  // スプレッドシート側でDate型に変換された値はUTCのISO文字列で返ってくる
  // （例: JST 2026-09-07 00:00 が "2026-09-06T15:00:00.000Z" になる）。
  // JSTに戻してから日付部分だけを取り出す。
  const dt = new Date(s);
  if(isNaN(dt.getTime())) return s.slice(0,10);
  const jst = new Date(dt.getTime() + 9*60*60*1000);
  return jst.toISOString().slice(0,10);
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(mk){
  const [y,m] = mk.split('-');
  return `${y}年${parseInt(m)}月`;
}
function personColor(p){ return p==='self' ? 'var(--self-color)' : 'var(--spouse-color)'; }
function personName(p){ return people[p] || p; }

function showToast(msg){

  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function fillCategoryOptions(sel, type){
  sel.innerHTML = '';

function onSubmitEntry(ev){
  ev.preventDefault();
  const date = document.getElementById('fDate').value;
  const category = document.getElementById('fCategory').value;
  const amount = parseFloat(document.getElementById('fAmount').value);
  const memo = document.getElementById('fMemo').value.trim();
  if(!date || !amount || amount <= 0){
    showToast('日付と金額を確認してください');
    return;
  }
  if(state.editingId){
    const idx = entries.findIndex(e=>e.id===state.editingId);
    if(idx !== -1){
      entries[idx] = { ...entries[idx], date, category, amount, memo, type: state.type };
      persistEntries();
      syncToGAS('updateEntry', entries[idx]);
      showToast('更新しました');
    }
    state.editingId = null;
  } else {
    const entry = {
      id: uid(),
      date, person: state.currentPerson, type: state.type,
      category, amount, memo, createdAt: new Date().toISOString()
    };
    entries.push(entry);
    persistEntries();
    syncToGAS('addEntry', entry);
    showToast('記録しました');
  }
  state.selectedMonth = monthKey(date);
  renderLedgerTab();
}

function startEditEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  state.editingId = id;
  state.type = e.type;
  renderLedgerTab();
  const form = document.getElementById('entryForm');
  if(form) form.scrollIntoView({behavior:'smooth', block:'start'});
}

function deleteEntry(id){
  const idx = entries.findIndex(e=>e.id===id);
  if(idx===-1) return;
  entries.splice(idx,1);
  if(state.editingId === id) state.editingId = null;
  persistEntries();
  syncToGAS('deleteEntry', { id });
  showToast('削除しました');
  renderLedgerTab();
}

/* =========================================================
   グラフ（SVGで自前描画・外部ライブラリ不使用）
   ========================================================= */
function renderChart(months, byMonth){
  const wrap = document.getElementById('chartWrap');
  if(months.length === 0){
    wrap.innerHTML = '<div class="empty-note">まだデータがありません。入力するとここにグラフが表示されます。</div>';
    return;
  }
  const barGroupW = 56;
  const w = Math.max(320, months.length * barGroupW + 40);
  const h = 180;
  const padBottom = 24;
  const padTop = 10;
  const maxVal = Math.max(1, ...months.map(mk => Math.max(byMonth[mk].income, byMonth[mk].expense)));
  const scale = (h - padTop - padBottom) / maxVal;

  let bars = '';
  months.forEach((mk, i)=>{
    const gx = 20 + i * barGroupW;
    const inc = byMonth[mk].income, exp = byMonth[mk].expense;
    const incH = inc * scale, expH = exp * scale;
    const selected = mk === state.selectedMonth;
    bars += `
      <g class="month-group" data-month="${mk}" style="cursor:pointer">
        <rect x="${gx}" y="${h - padBottom - incH}" width="18" height="${incH}" rx="3"
          fill="var(--income)" class="bar" opacity="${selected?1:0.85}"/>
        <rect x="${gx+22}" y="${h - padBottom - expH}" width="18" height="${expH}" rx="3"
          fill="var(--expense)" class="bar" opacity="${selected?1:0.85}"/>
        ${selected ? `<rect x="${gx-4}" y="${padTop-4}" width="48" height="${h-padTop-padBottom+8}" fill="none" stroke="var(--accent)" stroke-dasharray="3,3" rx="6"/>` : ''}
        <text x="${gx+20}" y="${h-6}" text-anchor="middle" class="axis-label">${mk.slice(2).replace('-','/')}</text>
      </g>`;
  });

  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${bars}</svg>`;

  wrap.querySelectorAll('.month-group').forEach(g=>{
    g.addEventListener('click', ()=>{
      state.selectedMonth = g.dataset.month;
      renderChartSelectionOnly();
      renderDetail(visibleEntries());
    });
  });
}
function renderChartSelectionOnly(){
  // re-render chart highlight without full page rebuild
  const list = visibleEntries();
  const byMonth = {};
  list.forEach(e=>{
    const mk = monthKey(e.date);
    if(!byMonth[mk]) byMonth[mk] = {income:0, expense:0};
    byMonth[mk][e.type] += e.amount;
  });
  renderChart(Object.keys(byMonth).sort(), byMonth);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================
   月次評価タブ
   -----------------------------------------------------------
   費目ごとに設定した「月間予算」と、その月の実績（支出額の合計）を
   比較して点数化する。貯金の達成/未達は評価対象に含めない（そもそも
   このアプリでは貯金額を評価軸として扱っていないため、自然と対象外）。
   予算は費目ごとに1つだけ保持する単純な仕組みで、過去の月を見るとき
   も「今設定されている予算」を当てはめて評価する（月ごとに予算を
   さかのぼって記録する仕組みは持たない簡易版）。
   ========================================================= */
function evalMonthScore(mk){
  const byCat = {};
  entries.forEach(e=>{
    if(e.type !== 'expense' || monthKey(e.date) !== mk) return;
    byCat[e.category] = (byCat[e.category] || 0) + e.amount;
  });
  const details = Object.keys(budgets)
    .filter(cat => budgets[cat] > 0)
    .map(cat=>{
      const budget = budgets[cat];
      const actual = byCat[cat] || 0;
      const ratio = actual / budget;
      const score = ratio <= 1 ? 100 : Math.max(0, Math.round(100 - (ratio - 1) * 100));
      return { category: cat, budget, actual, ratio, score };
    })
    .sort((a,b)=> b.ratio - a.ratio);
  const overall = details.length
    ? Math.round(details.reduce((s,d)=>s+d.score,0) / details.length)
    : null;
  return { overall, details };
}
function scoreClass(score){
  if(score === null) return '';
  if(score >= 80) return 'good';
  if(score >= 50) return 'warn';
  return 'bad';
}
function scoreComment(score){
  if(score === null) return '費目ごとの予算を設定すると、ここに評価が表示されます。';
  if(score >= 90) return '素晴らしい！ほぼ予算どおりに収まっています。';
  if(score >= 80) return '順調です。この調子で。';
  if(score >= 50) return 'やや使いすぎ気味の費目があります。';
  return '予算オーバーが目立ちます。内訳を見直してみましょう。';
}
function shiftEvalMonth(delta){
  let [y,m] = state.evalMonth.split('-').map(Number);
  m += delta;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  state.evalMonth = `${y}-${String(m).padStart(2,'0')}`;
  renderEvaluationTab();
}

function renderEvaluationTab(){
  const main = document.getElementById('mainArea');
  if(!state.evalMonth) state.evalMonth = todayStr().slice(0,7);
  const { overall, details } = evalMonthScore(state.evalMonth);
  const cls = scoreClass(overall);

  const detailsHtml = details.length ? details.map(d=>`
    <div class="eval-item">
      <div class="eval-item-top">
        <span class="eval-cat">${escapeHtml(d.category)}</span>
        <span class="eval-amt">${fmtYen(d.actual)} / ${fmtYen(d.budget)}</span>
      </div>
      <div class="eval-bar-track">
        <div class="eval-bar-fill ${d.ratio > 1 ? 'over' : ''}" style="width:${Math.min(100, d.ratio*100)}%"></div>
      </div>
    </div>
  `).join('') : '<div class="empty-note">まだ予算が設定されている費目がありません</div>';

  main.innerHTML = `
    <div class="card">
      <div class="month-header">
        <button type="button" id="evalPrev">‹ 前月</button>
        <div class="m-label">${monthLabel(state.evalMonth)}の評価</div>
        <button type="button" id="evalNext">次月 ›</button>
      </div>
      <div class="score-wrap">
        <div class="score-num ${cls}">${overall === null ? '—' : overall}</div>
        <div class="score-unit">${overall === null ? '' : '点 / 100点'}</div>
      </div>
      <div class="score-comment">${scoreComment(overall)}</div>
    </div>

    <div class="card">
      <h2>費目別 予算と実績（変動費）</h2>
      <div>${detailsHtml}</div>
      <button type="button" class="cancel-btn" id="btnEditBudget" style="margin-top:14px;width:100%;">予算を設定する</button>
    </div>

    <div class="card">
      <h2>評価の推移</h2>
      <div class="chart-wrap" id="evalHistoryChart"></div>
    </div>
  `;

  document.getElementById('evalPrev').onclick = ()=> shiftEvalMonth(-1);
  document.getElementById('evalNext').onclick = ()=> shiftEvalMonth(1);

function renderEvalHistoryChart(){
  const wrap = document.getElementById('evalHistoryChart');
  if(!Object.keys(budgets).some(cat => budgets[cat] > 0)){
    wrap.innerHTML = '<div class="empty-note">予算を設定すると、ここに月ごとの評価の推移が表示されます。</div>';
    return;
  }
  const monthsSet = new Set(
    entries.filter(e=>e.type==='expense').map(e=>monthKey(e.date))
  );
  monthsSet.add(state.evalMonth);
  const months = Array.from(monthsSet).sort();

  const barGroupW = 44;
  const w = Math.max(320, months.length * barGroupW + 30);
  const h = 160;
  const padBottom = 22, padTop = 20;
  const usable = h - padTop - padBottom;

  let bars = '';
  months.forEach((mk,i)=>{
    const { overall } = evalMonthScore(mk);
    const gx = 16 + i * barGroupW;
    const val = overall === null ? 0 : overall;
    const barH = (val/100) * usable;
    const color = overall === null ? '#dfe3e0' : (overall>=80 ? 'var(--income)' : overall>=50 ? '#c98a2c' : 'var(--expense)');
    const selected = mk === state.evalMonth;
    bars += `
      <g class="eval-month-group" data-month="${mk}" style="cursor:pointer">
        ${selected ? `<rect x="${gx-4}" y="${padTop-6}" width="32" height="${h-padTop-padBottom+10}" fill="none" stroke="var(--accent)" stroke-dasharray="3,3" rx="6"/>` : ''}
        <rect x="${gx}" y="${h - padBottom - barH}" width="24" height="${Math.max(barH,2)}" rx="3" fill="${color}" opacity="${selected?1:0.85}"/>
        <text x="${gx+12}" y="${h - padBottom - barH - 5}" text-anchor="middle" class="axis-label" font-weight="700">${overall===null?'':overall}</text>
        <text x="${gx+12}" y="${h-6}" text-anchor="middle" class="axis-label">${mk.slice(2).replace('-','/')}</text>
      </g>`;
  });

  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${bars}</svg>`;
  wrap.querySelectorAll('.eval-month-group').forEach(g=>{
    g.addEventListener('click', ()=>{
      state.evalMonth = g.dataset.month;
      renderEvaluationTab();
    });
  });
}

/* =========================================================
   ライフプランタブ
   -----------------------------------------------------------
   家計簿とは別軸の独立したシミュレーション。「基本設定」で入力した
   月あたりの収入・支出を基準値として使い、そこに住宅ローン・教育費・
   車の買い替え・保険・その他イベントといった増減要因を年ごとに重ねて、
   100歳までの資産推移を概算する。家計簿の実績はここには反映されない
   （逆に、ここで立てた計画を基準に家計簿の使いすぎを確認する使い方を
   想定している）。あくまで目安のシミュレーションであり、税金や社会
   保険料の詳細、運用の暴落・市場変動などは考慮しない簡易モデル。

   一度設定したらほとんど変更しない項目が多いため、入力項目は
   すべて「設定ページ」（renderLifeplanSettingsPage）にまとめ、
   ライフプランタブを開いたときは基本的にダッシュボード
   （renderLifeplanDashboard、グラフと要約のみ）を表示する。
   ========================================================= */
let lifeplanRows = null;
let lifeplanView = 'dashboard'; // 'dashboard' | 'settings'

function mortgageAnnualPayment(balance, years, ratePct){
  if(balance <= 0 || years <= 0) return 0;
  const r = ratePct/100;
  if(r === 0) return balance/years;
  return balance * r / (1 - Math.pow(1+r, -years));
}

/* 1人分の年収を計算する。育休などの「収入が減る期間」が該当する年は
   その期間に指定された月収をそのまま使い、それ以外は通常の昇給
   （年率複利 or 定額）カーブに沿って計算する。育休が明けた翌年以降は、
   育休がなかった場合と同じ経過年数ベースの昇給カーブに戻る
   （育休期間中も「時が止まる」わけではない、という単純化）。 */
function computePersonIncomeForYear(person, year, i){
  const leave = (person.leaves||[]).find(l => year >= l.startYear && year < l.startYear + Math.max(1, l.years||1));
  if(leave) return (leave.monthlyIncome||0) * 12;
  const baseAnnual = (person.monthlyIncome||0) * 12;
  if(person.incomeGrowthMode === 'fixed'){
    return baseAnnual + (person.incomeGrowthFixed||0) * i;
  }
  const growthFactor = Math.pow(1 + (person.incomeGrowthRate||0)/100, i);
  return baseAnnual * growthFactor;
}

function educationExpenseForYear(year){
  let total = 0;
  lifeplan.children.forEach(child=>{
    const age = year - child.birthYear;
    Object.keys(EDU_COST_REF).forEach(stageKey=>{
      const stage = EDU_COST_REF[stageKey];
      const endAge = stage.startAge + stage.years - 1;
      if(age >= stage.startAge && age <= endAge){
        const choice = child.edu[stageKey] || 'public';
        const override = child.eduCost && child.eduCost[stageKey];
        total += (override != null && override > 0) ? override : stage[choice];
      }
    });
  });
  return total;
}

function computeLifePlanProjection(){
  if(!lifeplan.currentAge) return null;
  const startYear = new Date().getFullYear();
  const yearsToProject = Math.max(1, 100 - lifeplan.currentAge + 1);
  const infl = lifeplan.inflationRate/100;

  let mortgageBalance = lifeplan.mortgage.balance;
  const mortgagePayment = mortgageAnnualPayment(lifeplan.mortgage.balance, lifeplan.mortgage.years, lifeplan.mortgage.rate);
  let mortgageYearsLeft = lifeplan.mortgage.years;

  let realEstateValue = lifeplan.realEstate.price;
  let cash = 0;
  const invBalances = {};
  lifeplan.investments.forEach(inv => invBalances[inv.id] = 0);
  const insuranceAnnualTotal = lifeplan.insurances.reduce((s,i)=> s + (i.annualPremium||0), 0);

  const rows = [];
  for(let i=0; i<yearsToProject; i++){
    const year = startYear + i;
    const age = lifeplan.currentAge + i;
    const isRetired = age >= lifeplan.retirement.retireAge;
    const inflationFactor = Math.pow(1+infl, i);

    let income;
    if(isRetired){
      income = lifeplan.retirement.pensionAnnual * inflationFactor;
    } else {
      income = computePersonIncomeForYear(lifeplan.baseline.self, year, i)
              + computePersonIncomeForYear(lifeplan.baseline.spouse, year, i);
    }
    if(age === lifeplan.retirementBonus.age && lifeplan.retirementBonus.amount > 0){
      income += lifeplan.retirementBonus.amount;
    }

    let baseLiving = isRetired ? lifeplan.retirement.livingCostAnnual : (lifeplan.baseline.monthlyExpense||0)*12;
    baseLiving *= inflationFactor;

    let mortgageCost = 0;
    if(mortgageBalance > 0 && mortgageYearsLeft > 0){
      const interest = mortgageBalance * (lifeplan.mortgage.rate/100);
      let principal = mortgagePayment - interest;
      if(principal > mortgageBalance) principal = mortgageBalance;
      if(principal < 0) principal = 0;
      mortgageCost = interest + principal;
      mortgageBalance = Math.max(0, mortgageBalance - principal);
      mortgageYearsLeft--;
    }

    if(i > 0) realEstateValue *= (1 + lifeplan.realEstate.appreciationRate/100);
    const realEstateNet = Math.max(0, realEstateValue - mortgageBalance);

    let carCost = 0;
    if(lifeplan.car.cycleYears > 0 && i > 0 && i % lifeplan.car.cycleYears === 0){
      carCost = lifeplan.car.cost * inflationFactor;
    }

    const eduCost = educationExpenseForYear(year) * inflationFactor;

    let eventCost = 0;
    lifeplan.otherEvents.forEach(ev=>{ if(ev.year === year) eventCost += ev.amount; });

    let investContribution = 0;
    const investTotals = { nisa_tsumitate:0, nisa_growth:0, ideco:0, taxable:0 };
    lifeplan.investments.forEach(inv=>{
      const annualAmount = isRetired ? 0 : (inv.monthlyAmount||0) * 12;
      invBalances[inv.id] = invBalances[inv.id] * (1 + (inv.returnRate||0)/100) + annualAmount;
      investContribution += annualAmount;
      investTotals[inv.type] = (investTotals[inv.type]||0) + invBalances[inv.id];
    });

    const insuranceCost = insuranceAnnualTotal * inflationFactor;
    const totalExpense = baseLiving + mortgageCost + carCost + eduCost + eventCost + insuranceCost;
    const netCashFlow = income - totalExpense - investContribution;
    cash += netCashFlow;

    const totalAssets = cash + investTotals.nisa_tsumitate + investTotals.nisa_growth + investTotals.ideco + investTotals.taxable + realEstateNet;

    rows.push({ year, age, income, expense: totalExpense, netCashFlow, cash, invest: investTotals, realEstateNet, totalAssets, mortgageBalance, isRetired });
  }
  return rows;
}

function renderLifeplanFlowChart(rows){
  const wrap = document.getElementById('lifeplanFlowChart');
  if(!wrap) return;
  const barGroupW = 20;
  const w = Math.max(320, rows.length*barGroupW + 30);
  const h = 180;
  const padBottom = 22, padTop = 10;
  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.income, r.expense)));
  const scale = (h-padTop-padBottom)/maxVal;
  let bars = '';
  rows.forEach((r,i)=>{
    const gx = 10 + i*barGroupW;
    const incH = r.income*scale, expH = r.expense*scale;
    bars += `
      <g>
        <rect x="${gx}" y="${h-padBottom-incH}" width="7" height="${Math.max(incH,0)}" fill="var(--income)" opacity="0.85"/>
        <rect x="${gx+8}" y="${h-padBottom-expH}" width="7" height="${Math.max(expH,0)}" fill="var(--expense)" opacity="0.85"/>
        ${i % 5 === 0 ? `<text x="${gx+7}" y="${h-6}" text-anchor="middle" class="axis-label">${r.year}</text>` : ''}
      </g>`;
  });
  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${bars}</svg>`;
}

function renderLifeplanAssetChart(rows){
  const wrap = document.getElementById('lifeplanAssetChart');
  if(!wrap) return;
  const seriesDefs = [
    { key:'cash', color: ASSET_SERIES_COLORS.cash, get:r=>r.cash },
    { key:'nisa_tsumitate', color: ASSET_SERIES_COLORS.nisa_tsumitate, get:r=>r.invest.nisa_tsumitate },
    { key:'nisa_growth', color: ASSET_SERIES_COLORS.nisa_growth, get:r=>r.invest.nisa_growth },
    { key:'ideco', color: ASSET_SERIES_COLORS.ideco, get:r=>r.invest.ideco },
    { key:'taxable', color: ASSET_SERIES_COLORS.taxable, get:r=>r.invest.taxable },
    { key:'realEstate', color: ASSET_SERIES_COLORS.realEstate, get:r=>r.realEstateNet },
    { key:'total', color: ASSET_SERIES_COLORS.total, get:r=>r.totalAssets },
  ];
  const visible = seriesDefs.filter(s => lifeplan.visibleSeries[s.key]);
  const maxVal = Math.max(1, ...rows.map(r=>Math.max(r.totalAssets, 0)));
  const w = Math.max(320, rows.length*14 + 40);
  const h = 220;
  const padBottom = 22, padTop = 14, padLeft = 6;
  const usable = h - padTop - padBottom;
  const scaleY = v => h - padBottom - (Math.max(0,v)/maxVal) * usable;
  const scaleX = i => padLeft + i*14;

  const linesHtml = visible.map(s=>{
    const pts = rows.map((r,i)=> `${scaleX(i)},${scaleY(s.get(r))}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.key==='total' ? 2.5 : 1.8}" opacity="${s.key==='total' ? 1 : 0.85}"/>`;
  }).join('');

  let labels = '';
  rows.forEach((r,i)=>{
    if(i % 5 === 0) labels += `<text x="${scaleX(i)}" y="${h-6}" text-anchor="middle" class="axis-label">${r.year}</text>`;
  });

  wrap.innerHTML = `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${linesHtml}${labels}</svg>`;
}

function renderChildEduCard(child){
  const currentYear = new Date().getFullYear();
  const age = currentYear - child.birthYear;
  const stagesHtml = Object.keys(EDU_COST_REF).map(stageKey=>{
    const stage = EDU_COST_REF[stageKey];
    const choice = child.edu[stageKey] || 'public';
    const refCost = stage[choice];
    const overrideVal = (child.eduCost && child.eduCost[stageKey] != null) ? child.eduCost[stageKey] : '';
    return `
      <div class="edu-stage-row">
        <div class="edu-stage-label">${stage.label}</div>
        <select class="child-edu-choice" data-child="${child.id}" data-stage="${stageKey}">
          <option value="public" ${choice==='public'?'selected':''}>公立（目安 年${Math.round(stage.public/10000)}万円）</option>
          <option value="private" ${choice==='private'?'selected':''}>私立（目安 年${Math.round(stage.private/10000)}万円）</option>
        </select>
        <input type="number" class="child-edu-override" data-child="${child.id}" data-stage="${stageKey}" placeholder="${refCost}" value="${overrideVal}" title="年額を上書き（空欄なら目安を使用）">
      </div>`;
  }).join('');

  return `
    <div class="child-card">
      <div class="form-row">
        <div><label>名前</label><input type="text" class="child-name" data-child="${child.id}" value="${escapeAttr(child.name)}"></div>
        <div><label>生まれ年</label><input type="number" class="child-birthyear" data-child="${child.id}" value="${child.birthYear}"></div>
      </div>
      <div class="sync-status" style="margin:4px 0 8px;">現在 ${age}歳。費目の右の欄に金額を入れると目安を上書きできます。</div>
      ${stagesHtml}
    </div>`;
}

function wireChildEduCards(){
  document.querySelectorAll('.child-name').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = lifeplan.children.find(x=>x.id===inp.dataset.child);
      if(c) c.name = inp.value.trim() || c.name;
    });
  });
  document.querySelectorAll('.child-birthyear').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = lifeplan.children.find(x=>x.id===inp.dataset.child);
      if(c) c.birthYear = parseInt(inp.value) || c.birthYear;
      collectLifeplanFormValues();
      renderLifeplanSettingsPage();
    });
  });
  document.querySelectorAll('.child-edu-choice').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const c = lifeplan.children.find(x=>x.id===sel.dataset.child);
      if(c) c.edu[sel.dataset.stage] = sel.value;
      collectLifeplanFormValues();
      renderLifeplanSettingsPage();
    });
  });
  document.querySelectorAll('.child-edu-override').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const c = lifeplan.children.find(x=>x.id===inp.dataset.child);
      if(!c) return;
      if(!c.eduCost) c.eduCost = {};
      const val = parseFloat(inp.value);
      if(val > 0) c.eduCost[inp.dataset.stage] = val;
      else delete c.eduCost[inp.dataset.stage];
    });
  });
}

function wireIncomeCard(personKey){
  const prefix = 'lp' + (personKey==='self' ? 'Self' : 'Spouse');

  document.querySelectorAll(`#${prefix}GrowthModeToggle button`).forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(`#${prefix}GrowthModeToggle button`).forEach(b=>b.classList.remove('active','income'));
      btn.classList.add('active','income');
      document.getElementById(`${prefix}GrowthMode`).value = btn.dataset.mode;
      document.getElementById(`${prefix}GrowthRateField`).hidden = (btn.dataset.mode === 'fixed');
      document.getElementById(`${prefix}GrowthFixedField`).hidden = (btn.dataset.mode !== 'fixed');
    };
  });

  document.getElementById(`${prefix}BtnAddLeave`).onclick = ()=>{
    const startYear = parseInt(document.getElementById(`${prefix}LeaveYear`).value);
    const years = parseInt(document.getElementById(`${prefix}LeaveYears`).value);
    const monthlyIncome = parseFloat(document.getElementById(`${prefix}LeaveIncome`).value);
    if(!startYear || !years){ showToast('開始年と期間を入力してください'); return; }
    collectLifeplanFormValues();
    lifeplan.baseline[personKey].leaves.push({ id: uid(), startYear, years, monthlyIncome: monthlyIncome || 0 });
    renderLifeplanSettingsPage();
  };
}

function removeIncomeLeave(personKey, id){
  collectLifeplanFormValues();
  lifeplan.baseline[personKey].leaves = lifeplan.baseline[personKey].leaves.filter(l=>l.id!==id);
  renderLifeplanSettingsPage();
}

/* フォーム上の未保存の値を lifeplan オブジェクトへ反映する。
   一覧への追加・削除はモーダル全体を再描画するため、その前に必ず
   呼び出して、他の項目に入力中の値が消えないようにする。 */
function collectLifeplanFormValues(){
  const p = lifeplan;
  const val = (id) => document.getElementById(id);
  if(!val('lpMortgageBalance')) return;
  p.currentAge = parseInt(val('lpAge').value) || null;
  p.inflationRate = parseFloat(val('lpInflation').value) || 0;
  p.baseline.monthlyExpense = parseFloat(val('lpBaselineExpense').value) || 0;
  ['self','spouse'].forEach(personKey=>{
    const prefix = 'lp' + (personKey==='self' ? 'Self' : 'Spouse');
    const person = p.baseline[personKey];
    if(!val(`${prefix}Income`)) return;
    person.monthlyIncome = parseFloat(val(`${prefix}Income`).value) || 0;
    person.incomeGrowthMode = val(`${prefix}GrowthMode`).value === 'fixed' ? 'fixed' : 'rate';
    person.incomeGrowthRate = parseFloat(val(`${prefix}GrowthRate`).value) || 0;
    person.incomeGrowthFixed = parseFloat(val(`${prefix}GrowthFixed`).value) || 0;
  });
  p.mortgage.balance = parseFloat(val('lpMortgageBalance').value) || 0;
  p.mortgage.years = parseInt(val('lpMortgageYears').value) || 0;
  p.mortgage.rate = parseFloat(val('lpMortgageRate').value) || 0;
  p.realEstate.price = parseFloat(val('lpRePrice').value) || 0;
  p.realEstate.appreciationRate = parseFloat(val('lpReRate').value) || 0;
  p.retirement.pensionAnnual = parseFloat(val('lpPension').value) || 0;
  p.retirement.livingCostAnnual = parseFloat(val('lpRetireLiving').value) || 0;
  p.retirement.retireAge = parseInt(val('lpRetireAge').value) || 65;
  p.retirementBonus.amount = parseFloat(val('lpRetireBonus').value) || 0;
  p.retirementBonus.age = parseInt(val('lpRetireBonusAge').value) || 65;
  p.car.cycleYears = parseInt(val('lpCarCycle').value) || 0;
  p.car.cost = parseFloat(val('lpCarCost').value) || 0;
}

function removeInsurance(id){ collectLifeplanFormValues(); lifeplan.insurances = lifeplan.insurances.filter(x=>x.id!==id); renderLifeplanSettingsPage(); }
function removeInvestment(id){ collectLifeplanFormValues(); lifeplan.investments = lifeplan.investments.filter(x=>x.id!==id); renderLifeplanSettingsPage(); }

  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h3>設定</h3>

        <div class="field-group">
          <h4>利用者の名前</h4>
          <div class="name-edit-row">
            <span class="dot" style="background:var(--self-color)"></span>
            <input type="text" id="nameSelf" value="${escapeAttr(people.self)}" placeholder="自分">
          </div>
          <div class="name-edit-row">
            <span class="dot" style="background:var(--spouse-color)"></span>
            <input type="text" id="nameSpouse" value="${escapeAttr(people.spouse)}" placeholder="配偶者">
          </div>
        </div>

        <div class="field-group">
          <h4>テーマカラー</h4>
          <div class="theme-row">
            <span class="theme-row-label"><span class="dot" id="selfThemeDot" style="background:${themeColors.self}"></span>${escapeHtml(people.self)}</span>
            <div class="swatch-row" id="selfSwatches"></div>
            <input type="color" id="selfCustomColor" class="custom-color" value="${themeColors.self}">
          </div>
          <div class="theme-row">
            <span class="theme-row-label"><span class="dot" id="spouseThemeDot" style="background:${themeColors.spouse}"></span>${escapeHtml(people.spouse)}</span>
            <div class="swatch-row" id="spouseSwatches"></div>
            <input type="color" id="spouseCustomColor" class="custom-color" value="${themeColors.spouse}">
          </div>
          <div class="sync-status">「入力者」として選ばれている方の色が、ボタンなどページ全体に反映されます。</div>
        </div>

        <div class="field-group">
          <h4>支出の費目</h4>
          <div class="chip-row" id="expenseChips"></div>
          <div class="add-chip-row">
            <input type="text" id="newExpenseCat" placeholder="新しい費目を追加">
            <button type="button" id="addExpenseCat">追加</button>
          </div>
        </div>

        <div class="field-group">
          <h4>収入の費目</h4>
          <div class="chip-row" id="incomeChips"></div>
          <div class="add-chip-row">
            <input type="text" id="newIncomeCat" placeholder="新しい収入区分を追加">
            <button type="button" id="addIncomeCat">追加</button>
          </div>
        </div>

        <div class="field-group">
          <h4>Google Apps Script 連携（任意・後で設定可）</h4>
          <label>GAS Web App URL</label>
          <input type="text" id="gasUrlInput" value="${escapeAttr(config.gasUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
          <label>合言葉（GAS側のSECRET_KEYと同じ文字列）</label>
          <input type="text" id="gasSecretInput" value="${escapeAttr(config.gasSecret||'')}" placeholder="合言葉を入力">
          <div class="sync-status">
            未設定の間はローカル保存のみで動作します（<code>console.log</code>に同期予定の内容を出力する疎通確認ダミー）。<br>
            GASのWebアプリを公開したら、URLと合言葉をここに貼るだけで書き込みが有効になります。
          </div>
        </div>

        <div class="modal-close-row">
          <button class="cancel-btn" id="modalCancel">閉じる</button>
          <button class="submit-btn" id="modalSave">保存</button>
        </div>
      </div>
    </div>
  `;
  renderChips('expenseChips', 'expense');
  renderChips('incomeChips', 'income');
  renderThemeSwatches('selfSwatches', 'self');
  renderThemeSwatches('spouseSwatches', 'spouse');
  document.getElementById('selfCustomColor').oninput = (e)=> pickThemeColor('self', e.target.value);
  document.getElementById('spouseCustomColor').oninput = (e)=> pickThemeColor('spouse', e.target.value);

  document.getElementById('addExpenseCat').onclick = ()=> addCategory('expense', 'newExpenseCat');
  document.getElementById('addIncomeCat').onclick = ()=> addCategory('income', 'newIncomeCat');
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.getElementById('modalSave').onclick = ()=>{
    people.self = document.getElementById('nameSelf').value.trim() || '自分';
    people.spouse = document.getElementById('nameSpouse').value.trim() || '配偶者';
    config.gasUrl = document.getElementById('gasUrlInput').value.trim();
    config.gasSecret = document.getElementById('gasSecretInput').value.trim();
    persistPeople(); persistCategories(); persistConfig();
    closeModal();
    showToast('設定を保存しました');
    renderAll();
  };
}
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function renderChips(containerId, type){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  categories[type].forEach((c, idx)=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${escapeHtml(c)} <button type="button" title="削除">✕</button>`;
    chip.querySelector('button').onclick = ()=>{
      categories[type].splice(idx,1);
      renderChips(containerId, type);
    };
    el.appendChild(chip);
  });
}
function renderThemeSwatches(containerId, person){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  THEME_PALETTE.forEach(color=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch' + (themeColors[person] === color ? ' selected' : '');
    b.style.background = color;
    b.title = color;
    b.onclick = ()=> pickThemeColor(person, color);
    el.appendChild(b);
  });
}
function pickThemeColor(person, color){
  themeColors[person] = color;
  persistTheme();
  applyTheme();
  renderThemeSwatches(person==='self' ? 'selfSwatches' : 'spouseSwatches', person);
  const customInput = document.getElementById(person==='self' ? 'selfCustomColor' : 'spouseCustomColor');
  if(customInput) customInput.value = color;
  const dot = document.getElementById(person==='self' ? 'selfThemeDot' : 'spouseThemeDot');
  if(dot) dot.style.background = color;
  renderAll();
}

function addCategory(type, inputId){
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  if(categories[type].includes(val)){ input.value=''; return; }
  categories[type].push(val);
  input.value = '';
  renderChips(type==='expense' ? 'expenseChips' : 'incomeChips', type);
}

/* =========================================================
   固定費モーダル（毎月自動入力される費用の登録・編集・削除）
   ========================================================= */
document.getElementById('btnFixed').addEventListener('click', openFixedModal);

let fixedEditingId = null; // null=一覧表示のみ, 'new'=新規追加中, それ以外=そのIDを編集中

function openFixedModal(){
  fixedEditingId = null;
  renderFixedModal();
}

function renderFixedModal(){
  const root = document.getElementById('modalRoot');
  const showForm = fixedEditingId !== null;
  const editing = (showForm && fixedEditingId !== 'new') ? fixedCosts.find(f=>f.id===fixedEditingId) : null;

  const listHtml = fixedCosts.length ? fixedCosts.map(f=>`
    <div class="fixed-item">
      <span class="who-dot" style="background:${personColor(f.person)}" title="${personName(f.person)}"></span>
      <div class="main">
        <div class="cat">${escapeHtml(f.category)}<span class="fixed-type ${f.type}">${f.type==='expense'?'支出':'収入'}</span></div>
        <div class="meta">${personName(f.person)} ・ 毎月${f.dayOfMonth}日${f.memo ? ' ・ '+escapeHtml(f.memo) : ''}</div>
      </div>
      <div class="amt ${f.type}">${fmtYen(f.amount)}</div>
      <button class="edit-btn" title="編集" onclick="editFixed('${f.id}')">✎</button>
      <button class="del" title="削除" onclick="removeFixed('${f.id}')">✕</button>
    </div>
  `).join('') : '<div class="empty-note">まだ固定費が登録されていません</div>';

  root.innerHTML = `
    <div class="modal-overlay" id="fixedModalOverlay">
      <div class="modal">
        <h3>固定費の管理</h3>
        <div class="sync-status" style="margin-bottom:12px;">
          家賃・電気代・保険料など毎月ほぼ同じ金額のものを登録すると、次回以降は自動で家計簿に記録されます。金額が変わったら「編集」してください（すでに記録済みの月は変わらず、今後の月から新しい金額が使われます）。
        </div>
        <div class="fixed-list">${listHtml}</div>
        ${showForm ? renderFixedForm(editing) : '<button type="button" class="submit-btn" id="btnAddFixed" style="margin-top:12px;">+ 固定費を追加</button>'}
        <div class="modal-close-row">
          <button class="cancel-btn" id="fixedModalClose">閉じる</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('fixedModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='fixedModalOverlay') closeModal(); });
  document.getElementById('fixedModalClose').onclick = closeModal;

  if(!showForm){
    document.getElementById('btnAddFixed').onclick = ()=>{ fixedEditingId = 'new'; renderFixedModal(); };
  } else {
    wireFixedForm(editing);
  }
}

function renderFixedForm(editing){
  const type = editing ? editing.type : 'expense';
  return `
    <div class="card" style="margin-top:10px;padding:14px;">
      <div class="type-toggle" id="fixedTypeToggle">
        <button type="button" data-type="expense" class="${type==='expense'?'active expense':''}">支出</button>
        <button type="button" data-type="income" class="${type==='income'?'active income':''}">収入</button>
      </div>
      <div class="form-row" style="margin-top:10px;">
        <div>
          <label>入力者</label>
          <select id="fixedPerson">
            <option value="self" ${(!editing || editing.person==='self') ? 'selected':''}>${escapeHtml(people.self)}</option>
            <option value="spouse" ${(editing && editing.person==='spouse') ? 'selected':''}>${escapeHtml(people.spouse)}</option>
          </select>
        </div>
        <div>
          <label>費目</label>
          <select id="fixedCategory"></select>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>金額</label>
          <input type="number" id="fixedAmount" min="0" step="1" value="${editing ? editing.amount : ''}" placeholder="0">
        </div>
        <div>
          <label>毎月の日付</label>
          <input type="number" id="fixedDay" min="1" max="31" value="${editing ? editing.dayOfMonth : 1}">
        </div>
      </div>
      <div>
        <label>メモ（任意）</label>
        <input type="text" id="fixedMemo" value="${editing ? escapeAttr(editing.memo||'') : ''}" placeholder="例）住宅ローン返済">
      </div>
      <div class="modal-close-row" style="margin-top:12px;">
        <button type="button" class="cancel-btn" id="fixedFormCancel">キャンセル</button>
        <button type="button" class="submit-btn" id="fixedFormSave">${editing ? '更新する' : '追加する'}</button>
      </div>
    </div>
  `;
}

function wireFixedForm(editing){
  const typeToggle = document.getElementById('fixedTypeToggle');
  const catSel = document.getElementById('fixedCategory');
  let curType = editing ? editing.type : 'expense';

  function fillCat(){
    fillCategoryOptions(catSel, curType);
    if(editing && editing.type === curType) catSel.value = editing.category;
  }
  fillCat();

  typeToggle.querySelectorAll('button').forEach(btn=>{
    btn.onclick = ()=>{
      curType = btn.dataset.type;
      typeToggle.querySelectorAll('button').forEach(b=>{
        b.classList.remove('active','expense','income');
      });
      btn.classList.add('active', curType);
      fillCat();
    };
  });

  document.getElementById('fixedFormCancel').onclick = ()=>{ fixedEditingId = null; renderFixedModal(); };
  document.getElementById('fixedFormSave').onclick = ()=>{
    const amount = parseFloat(document.getElementById('fixedAmount').value);
    const day = Math.min(31, Math.max(1, parseInt(document.getElementById('fixedDay').value) || 1));
    const category = catSel.value;
    const person = document.getElementById('fixedPerson').value;
    const memo = document.getElementById('fixedMemo').value.trim();
    if(!amount || amount <= 0 || !category){
      showToast('費目と金額を確認してください');
      return;
    }
    if(editing){
      Object.assign(editing, { type: curType, person, category, amount, dayOfMonth: day, memo });
      persistFixed();
      showToast('固定費を更新しました');
    } else {
      fixedCosts.push({
        id: uid(), type: curType, person, category, amount, dayOfMonth: day, memo,
        startMonth: todayStr().slice(0,7)
      });
      persistFixed();
      showToast('固定費を追加しました');
    }
    fixedEditingId = null;
    generateFixedEntries();
    renderFixedModal();
    renderLedgerTab();
  };
}

function editFixed(id){ fixedEditingId = id; renderFixedModal(); }
function removeFixed(id){
  fixedCosts = fixedCosts.filter(f=>f.id!==id);
  persistFixed();
  renderFixedModal();
  showToast('固定費を削除しました（すでに記録済みの明細は残ります）');
}

/* =========================================================
   タブ切り替え（月次評価・ライフプランは準備中プレースホルダー）
   ========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  if(btn.classList.contains('disabled')) return;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(btn.dataset.tab === 'ledger') renderLedgerTab();
    else if(btn.dataset.tab === 'evaluation') renderEvaluationTab();
    else if(btn.dataset.tab === 'lifeplan') renderLifeplanTab();
  });
});

/* =========================================================
   初期化
   ========================================================= */
generateFixedEntries();
applyTheme();
if(localStorage.getItem('kakeibo_current_person') === null){
  showPersonSetup();
} else {
  renderAll();
}
pullFromGAS(); // 起動時にスプレッドシートの最新内容を取得（GAS URL未設定なら何もしない）
</script>
</body>
</html>
